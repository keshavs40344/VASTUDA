<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Staunt Browser Ultra • Desktop Edition</title>
  <style>
    /* ==========================================================================
       1. macOS SEQUOIA DESIGN SYSTEM (Obsidian Frosted Glass)
       ========================================================================== */
    :root {
      --bg-topbar: rgba(14, 16, 24, 0.96);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #8b5cf6;
      --accent-purple: #8b5cf6;
      --accent-blue: #0a84ff;
      --accent-emerald: #30d158;
      --text-main: rgba(255, 255, 255, 0.95);
      --text-muted: rgba(255, 255, 255, 0.48);
      --text-dim: rgba(255, 255, 255, 0.28);
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --header-height: 44px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* CRITICAL: Transparent body so Electron native WebContentsView renders underneath */
      background: transparent !important;
      font-family: var(--font-stack);
      color: var(--text-main);
      user-select: none;
    }

    /* ==========================================================================
       2. TOP BAR (Fixed 44px - Frameless Draggable Window Header)
       ========================================================================== */
    #desktop-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--bg-topbar);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 10000;
      /* Draggable window region for frameless window */
      -webkit-app-region: drag;
    }

    /* Non-draggable elements */
    .no-drag, button, input, .tab-item {
      -webkit-app-region: no-drag;
    }

    /* Window Controls (macOS Traffic Lights) */
    .window-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 2px;
      padding-right: 4px;
      flex-shrink: 0;
    }
    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0.5px solid rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    .traffic-light:hover { filter: brightness(1.15); transform: scale(1.08); }
    .traffic-light:active { transform: scale(0.95); }
    .tl-close { background: #ff5f56; }
    .tl-min { background: #ffbd2e; }
    .tl-max { background: #27c93f; }

    /* Navigation Controls */
    .nav-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .nav-btn:active {
      transform: scale(0.92);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .nav-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* Tab Rail (Integrated into Topbar) */
    #tab-rail {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      max-width: 380px;
      flex-shrink: 1;
    }
    #tab-rail::-webkit-scrollbar { display: none; }

    .tab-item {
      height: 28px;
      min-width: 100px;
      max-width: 160px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .tab-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .tab-item.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      line-height: 1;
    }
    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-add-tab {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-add-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Unified Omnibox */
    .omnibox-box {
      flex: 1;
      min-width: 180px;
      max-width: 580px;
      height: 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 0.5px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 7px;
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .omnibox-box:focus-within {
      background: rgba(255, 255, 255, 0.10);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }
    .lock-indicator {
      color: var(--accent-emerald);
      display: flex;
      align-items: center;
      font-size: 11px;
    }
    .lock-indicator svg { width: 12px; height: 12px; }
    .omnibox-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 12.5px;
      font-weight: 400;
    }
    .omnibox-field::placeholder { color: var(--text-muted); }

    /* Actions Right */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Shield Badge */
    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(48, 209, 88, 0.12);
      border: 0.5px solid rgba(48, 209, 88, 0.35);
      color: #30d158;
      font-size: 10.5px;
      font-weight: 600;
      cursor: default;
    }
    .shield-badge svg { width: 11px; height: 11px; }

    .action-icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .action-icon-btn svg { width: 14px; height: 14px; }

    /* Progress Line */
    #desktop-progress {
      position: fixed;
      top: var(--header-height);
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #0a84ff, #30d158);
      z-index: 10001;
      opacity: 0;
      transition: width 0.25s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    #desktop-progress.active { opacity: 1; }
  </style>
</head>
<body>

  <!-- ========================================================================
       TOP BAR (Native Electron Frameless UI)
       ======================================================================== -->
  <header id="desktop-topbar">
    <!-- Window Controls (Traffic Lights) -->
    <div class="window-controls no-drag">
      <div class="traffic-light tl-close" id="btnDeskClose" title="Close Window (Alt+F4)"></div>
      <div class="traffic-light tl-min" id="btnDeskMin" title="Minimize"></div>
      <div class="traffic-light tl-max" id="btnDeskMax" title="Maximize"></div>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-group no-drag">
      <button class="nav-btn" id="btnDeskBack" title="Back (Alt+Left)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button class="nav-btn" id="btnDeskFwd" title="Forward (Alt+Right)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="nav-btn" id="btnDeskReload" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>

    <!-- Tabs Rail -->
    <div id="tab-rail" class="no-drag">
      <!-- Tabs injected via JS -->
      <button class="btn-add-tab" id="btnDeskAddTab" title="New Tab (Ctrl+T)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Unified Omnibox -->
    <div class="omnibox-box no-drag">
      <div class="lock-indicator" id="lockIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <input 
        type="text" 
        id="deskOmnibox" 
        class="omnibox-field" 
        placeholder="Search with Google or enter address" 
        spellcheck="false" 
        autocomplete="off" 
      />
    </div>

    <!-- Right Actions -->
    <div class="actions-group no-drag">
      <div class="shield-badge" id="shieldPill" title="Hardened Chromium Shield Active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
        <span id="shieldCount">Shield</span>
      </div>

      <button class="action-icon-btn" id="btnSplitView" title="Split View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      </button>

      <button class="action-icon-btn" id="btnDevTools" title="Developer Tools (F12)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </header>

  <!-- Progress Bar Line -->
  <div id="desktop-progress"></div>

  <!-- ========================================================================
       DESKTOP IPC GLUE ENGINE
       ======================================================================== -->
  <script>
    (function() {
      'use strict';

      const api = window.stauntAPI || window.stauntSecureBridge;
      if (!api) {
        console.warn('[STAUNT DESKTOP] IPC bridge not found.');
        return;
      }

      // DOM References
      const omnibox = document.getElementById('deskOmnibox');
      const tabRail = document.getElementById('tab-rail');
      const btnAddTab = document.getElementById('btnDeskAddTab');
      const progressLine = document.getElementById('desktop-progress');
      const shieldCount = document.getElementById('shieldCount');

      let currentTabs = [];
      let activeTabId = null;

      // Window controls
      document.getElementById('btnDeskClose').addEventListener('click', () => api.closeWindow());
      document.getElementById('btnDeskMin').addEventListener('click', () => api.minimizeWindow());
      document.getElementById('btnDeskMax').addEventListener('click', () => api.maximizeWindow());

      // Nav controls
      document.getElementById('btnDeskBack').addEventListener('click', () => api.goBack());
      document.getElementById('btnDeskFwd').addEventListener('click', () => api.goForward());
      document.getElementById('btnDeskReload').addEventListener('click', () => api.reload());
      btnAddTab.addEventListener('click', () => api.createTab('staunt://newtab'));

      // Tools
      document.getElementById('btnDevTools').addEventListener('click', () => api.toggleDevTools());
      document.getElementById('btnSplitView').addEventListener('click', () => api.toggleSplitView());

      // Omnibox Navigation
      omnibox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = omnibox.value.trim();
          if (val) {
            let target = val;
            if (!/^https?:\/\//i.test(val) && !val.startsWith('staunt://')) {
              if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(val) && !val.includes(' ')) {
                target = 'https://' + val;
              } else {
                target = 'https://www.google.com/search?q=' + encodeURIComponent(val);
              }
            }
            api.navigateTo(target);
          }
        }
      });
      omnibox.addEventListener('focus', () => omnibox.select());

      // Render Tabs in Tab Rail
      function renderTabs() {
        const addBtn = btnAddTab;
        tabRail.innerHTML = '';
        currentTabs.forEach(tab => {
          const tabEl = document.createElement('div');
          tabEl.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '');
          tabEl.dataset.id = tab.id;

          const isNew = !tab.url || tab.url.includes('newtab.html') || tab.url.startsWith('staunt://');
          const title = tab.title || (isNew ? 'New Tab' : tab.url);

          tabEl.innerHTML = \`
            <span class="tab-title">\${escapeHtml(title)}</span>
            <button class="tab-close" title="Close">×</button>
          \`;

          tabEl.addEventListener('click', () => api.switchTab(tab.id));
          tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
            e.stopPropagation();
            api.closeTab(tab.id);
          });

          tabRail.appendChild(tabEl);
        });
        tabRail.appendChild(addBtn);
      }

      // Listen for Tab Creation from Main Process
      if (typeof api.onTabCreated === 'function') {
        api.onTabCreated((tab) => {
          if (!currentTabs.some(t => t.id === tab.id)) {
            currentTabs.push(tab);
          }
          activeTabId = tab.id;
          renderTabs();
        });
      }

      // Listen for Tab Updates (title, url)
      if (typeof api.onTabUpdated === 'function') {
        api.onTabUpdated((tab) => {
          const idx = currentTabs.findIndex(t => t.id === tab.id);
          if (idx !== -1) {
            currentTabs[idx] = { ...currentTabs[idx], ...tab };
          } else {
            currentTabs.push(tab);
          }
          if (tab.id === activeTabId && tab.url) {
            if (!tab.url.includes('newtab.html') && !tab.url.startsWith('staunt://')) {
              omnibox.value = tab.url;
            } else {
              omnibox.value = '';
            }
          }
          renderTabs();
        });
      }

      // Listen for Tab Switch
      if (typeof api.onTabSwitched === 'function') {
        api.onTabSwitched(({ tabId, url }) => {
          activeTabId = tabId;
          if (url && !url.includes('newtab.html') && !url.startsWith('staunt://')) {
            omnibox.value = url;
          } else {
            omnibox.value = '';
          }
          renderTabs();
        });
      }

      // Listen for Tab Closed
      if (typeof api.onTabClosed === 'function') {
        api.onTabClosed(({ tabId, activeTabId: newActive }) => {
          currentTabs = currentTabs.filter(t => t.id !== tabId);
          if (newActive) activeTabId = newActive;
          renderTabs();
        });
      }

      // Listen for Omnibox URL Updates
      if (typeof api.onUrlUpdated === 'function') {
        api.onUrlUpdated((data) => {
          if (data && data.tabId === activeTabId) {
            if (data.url && !data.url.includes('newtab.html') && !data.url.startsWith('staunt://')) {
              omnibox.value = data.url;
            } else {
              omnibox.value = '';
            }

            if (data.isLoading) {
              progressLine.classList.add('active');
              progressLine.style.width = '70%';
            } else {
              progressLine.style.width = '100%';
              setTimeout(() => {
                progressLine.classList.remove('active');
                setTimeout(() => { progressLine.style.width = '0%'; }, 200);
              }, 250);
            }
          }
        });
      }

      // Listen for Shield Tracking Stats
      if (typeof api.onShieldUpdated === 'function') {
        api.onShieldUpdated((stats) => {
          if (stats && typeof stats.trackersBlocked === 'number') {
            shieldCount.textContent = stats.trackersBlocked + ' Blocked';
          }
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

    })();
  </script>
</body>
</html>
