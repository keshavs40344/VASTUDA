<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Staunt Browser Ultra • Desktop Edition</title>
  <style>
    /* ==========================================================================
       1. macOS SEQUOIA DESIGN SYSTEM (Obsidian Frosted Glass)
       ========================================================================== */
    :root {
      --bg-topbar: rgba(14, 16, 24, 0.96);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #8b5cf6;
      --accent-purple: #8b5cf6;
      --accent-blue: #0a84ff;
      --accent-emerald: #30d158;
      --text-main: rgba(255, 255, 255, 0.95);
      --text-muted: rgba(255, 255, 255, 0.48);
      --text-dim: rgba(255, 255, 255, 0.28);
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --header-height: 44px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* CRITICAL: Transparent body so Electron native WebContentsView renders underneath */
      background: transparent !important;
      font-family: var(--font-stack);
      color: var(--text-main);
      user-select: none;
    }

    /* ==========================================================================
       2. TOP BAR (Fixed 44px - Frameless Draggable Window Header)
       ========================================================================== */
    #desktop-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--bg-topbar);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 10000;
      /* Draggable window region for frameless window */
      -webkit-app-region: drag;
    }

    /* Non-draggable elements */
    .no-drag, button, input, .tab-item {
      -webkit-app-region: no-drag;
    }

    /* Window Controls (macOS Traffic Lights) */
    .window-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 2px;
      padding-right: 4px;
      flex-shrink: 0;
    }
    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0.5px solid rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    .traffic-light:hover { filter: brightness(1.15); transform: scale(1.08); }
    .traffic-light:active { transform: scale(0.95); }
    .tl-close { background: #ff5f56; }
    .tl-min { background: #ffbd2e; }
    .tl-max { background: #27c93f; }

    /* Navigation Controls */
    .nav-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .nav-btn:active {
      transform: scale(0.92);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .nav-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* Tab Rail (Integrated into Topbar) */
    #tab-rail {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      max-width: 380px;
      flex-shrink: 1;
    }
    #tab-rail::-webkit-scrollbar { display: none; }

    .tab-item {
      height: 28px;
      min-width: 100px;
      max-width: 160px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .tab-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .tab-item.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      line-height: 1;
    }
    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-add-tab {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-add-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Unified Omnibox Container */
    .omnibox-container {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 580px;
    }
    .omnibox-box {
      width: 100%;
      height: 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 0.5px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 7px;
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .omnibox-box:focus-within {
      background: rgba(255, 255, 255, 0.10);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }
    .lock-indicator {
      color: var(--accent-emerald);
      display: flex;
      align-items: center;
      font-size: 11px;
    }
    .lock-indicator svg { width: 12px; height: 12px; }
    .omnibox-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 12.5px;
      font-weight: 400;
    }
    .omnibox-field::placeholder { color: var(--text-muted); }

    /* Omnibox Autocomplete Dropdown */
    .omnibox-dropdown {
      position: absolute;
      top: 34px;
      left: 0;
      right: 0;
      background: rgba(14, 16, 24, 0.98);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      z-index: 10005;
      padding: 4px 0;
    }
    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .suggestion-item:hover, .suggestion-item.selected {
      background: rgba(139, 92, 246, 0.28);
      color: #fff;
    }
    .suggestion-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .suggestion-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggestion-type {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Actions Right */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Shield Badge */
    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(48, 209, 88, 0.12);
      border: 0.5px solid rgba(48, 209, 88, 0.35);
      color: #30d158;
      font-size: 10.5px;
      font-weight: 600;
      cursor: default;
    }
    .shield-badge svg { width: 11px; height: 11px; }

    .action-icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .action-icon-btn svg { width: 14px; height: 14px; }

    /* Progress Line */
    #desktop-progress {
      position: fixed;
      top: var(--header-height);
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #0a84ff, #30d158);
      z-index: 10001;
      opacity: 0;
      transition: width 0.25s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    #desktop-progress.active { opacity: 1; }

    /* Settings & Clear Data Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      width: 420px;
      max-width: 90vw;
      background: #141622;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
      padding: 22px;
      color: var(--text-main);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #fff; }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .modal-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
    }
    .modal-select {
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }
    .modal-select option {
      background: #181b26;
      color: #fff;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
    }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-primary-action {
      background: #8b5cf6;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-primary-action:hover { background: #7c3aed; }

    /* Download Toast */
    .download-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(18, 20, 29, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 10006;
      font-size: 12px;
      transform: translateY(60px);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      pointer-events: none;
    }
    .download-toast.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       TOP BAR (Native Electron Frameless UI)
       ======================================================================== -->
  <header id="desktop-topbar">
    <!-- Window Controls (Traffic Lights) -->
    <div class="window-controls no-drag">
      <div class="traffic-light tl-close" id="btnDeskClose" title="Close Window (Alt+F4)"></div>
      <div class="traffic-light tl-min" id="btnDeskMin" title="Minimize"></div>
      <div class="traffic-light tl-max" id="btnDeskMax" title="Maximize"></div>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-group no-drag">
      <button class="nav-btn" id="btnDeskBack" title="Back (Alt+Left)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button class="nav-btn" id="btnDeskFwd" title="Forward (Alt+Right)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="nav-btn" id="btnDeskReload" title="Reload (Ctrl+R)">
        <svg id="iconReload" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <svg id="iconStop" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <button class="nav-btn" id="btnDeskHome" title="Home (Alt+Home)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </button>
    </div>

    <!-- Tabs Rail -->
    <div id="tab-rail" class="no-drag">
      <!-- Tabs injected via JS -->
      <button class="btn-add-tab" id="btnDeskAddTab" title="New Tab (Ctrl+T)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Unified Omnibox with Autocomplete -->
    <div class="omnibox-container no-drag">
      <div class="omnibox-box">
        <div class="lock-indicator" id="lockIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <input 
          type="text" 
          id="deskOmnibox" 
          class="omnibox-field" 
          placeholder="Search with Staunt or enter address" 
          spellcheck="false" 
          autocomplete="off" 
        />
      </div>
      <div id="omnibox-dropdown" class="omnibox-dropdown" style="display: none;"></div>
    </div>

    <!-- Right Actions -->
    <div class="actions-group no-drag">
      <div class="shield-badge" id="shieldPill" title="Hardened Chromium Shield Active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
        <span id="shieldCount">Shield</span>
      </div>

      <button class="action-icon-btn" id="btnSplitView" title="Split View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      </button>

      <button class="action-icon-btn" id="btnDeskSettings" title="Settings / Clear Browsing Data (Ctrl+Shift+Del)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

      <button class="action-icon-btn" id="btnDevTools" title="Developer Tools (F12)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </header>

  <!-- Settings / Clear Data Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Clear Browsing Data</div>
        <button class="modal-close" id="btnModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-row">
          <label class="modal-label" for="timeRangeSelect">Time Range</label>
          <select class="modal-select" id="timeRangeSelect">
            <option value="1h">Last hour</option>
            <option value="24h" selected>Last 24 hours</option>
            <option value="7d">Last 7 days</option>
            <option value="4w">Last 4 weeks</option>
            <option value="all">All time</option>
          </select>
        </div>
        <div style="font-size: 12px; color: var(--text-muted); line-height: 1.5;">
          Clears browsing history, search cache, and temporary offline site storage across all windows.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelClear">Cancel</button>
        <button class="btn-primary-action" id="btnConfirmClear">Clear Data</button>
      </div>
    </div>
  </div>

  <!-- Download Toast -->
  <div class="download-toast" id="downloadToast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" id="downloadToastText">Downloading file...</div>
  </div>

  <!-- Progress Bar Line -->
  <div id="desktop-progress"></div>

  <!-- ========================================================================
       DESKTOP IPC GLUE ENGINE
       ======================================================================== -->
  <script>
    (function() {
      'use strict';

      const api = window.stauntAPI || window.stauntSecureBridge;
      if (!api) {
        console.warn('[STAUNT DESKTOP] IPC bridge not found.');
        return;
      }

      // DOM References
      const omnibox = document.getElementById('deskOmnibox');
      const omniboxDropdown = document.getElementById('omnibox-dropdown');
      const lockIcon = document.getElementById('lockIcon');
      const tabRail = document.getElementById('tab-rail');
      const btnAddTab = document.getElementById('btnDeskAddTab');
      const progressLine = document.getElementById('desktop-progress');
      const shieldCount = document.getElementById('shieldCount');
      const btnReload = document.getElementById('btnDeskReload');
      const iconReload = document.getElementById('iconReload');
      const iconStop = document.getElementById('iconStop');
      const btnSettings = document.getElementById('btnDeskSettings');
      const settingsModal = document.getElementById('settingsModal');
      const btnModalClose = document.getElementById('btnModalClose');
      const btnCancelClear = document.getElementById('btnCancelClear');
      const btnConfirmClear = document.getElementById('btnConfirmClear');
      const timeRangeSelect = document.getElementById('timeRangeSelect');
      const downloadToast = document.getElementById('downloadToast');
      const downloadToastText = document.getElementById('downloadToastText');

      let currentTabs = [];
      let activeTabId = null;
      let isPageLoading = false;
      let suggestDebounceTimer = null;
      let suggestionsList = [];
      let selectedSuggestIndex = -1;
      let toastDismissTimer = null;

      // Window controls
      document.getElementById('btnDeskClose').addEventListener('click', () => api.closeWindow());
      document.getElementById('btnDeskMin').addEventListener('click', () => api.minimizeWindow());
      document.getElementById('btnDeskMax').addEventListener('click', () => api.maximizeWindow());

      // Nav controls
      document.getElementById('btnDeskBack').addEventListener('click', () => api.goBack());
      document.getElementById('btnDeskFwd').addEventListener('click', () => api.goForward());
      btnReload.addEventListener('click', () => {
        if (isPageLoading && typeof api.stopNavigation === 'function') {
          api.stopNavigation();
        } else {
          api.reload();
        }
      });
      document.getElementById('btnDeskHome').addEventListener('click', () => {
        if (typeof api.goHome === 'function') api.goHome();
        else api.navigateTo('staunt://newtab');
      });
      btnAddTab.addEventListener('click', () => api.createTab('staunt://newtab'));

      // Tools & Settings
      document.getElementById('btnDevTools').addEventListener('click', () => api.toggleDevTools());
      document.getElementById('btnSplitView').addEventListener('click', () => api.toggleSplitView());
      if (btnSettings) {
        btnSettings.addEventListener('click', () => openSettingsModal());
      }

      // Settings Modal
      function openSettingsModal() {
        if (settingsModal) settingsModal.classList.add('active');
      }
      function closeSettingsModal() {
        if (settingsModal) settingsModal.classList.remove('active');
      }
      if (btnModalClose) btnModalClose.addEventListener('click', closeSettingsModal);
      if (btnCancelClear) btnCancelClear.addEventListener('click', closeSettingsModal);
      if (settingsModal) {
        settingsModal.addEventListener('click', (e) => {
          if (e.target === settingsModal) closeSettingsModal();
        });
      }
      if (btnConfirmClear) {
        btnConfirmClear.addEventListener('click', async () => {
          const range = timeRangeSelect ? timeRangeSelect.value : '24h';
          if (typeof api.clearHistory === 'function') {
            await api.clearHistory(range);
          }
          if (typeof api.clearCache === 'function') {
            api.clearCache();
          }
          closeSettingsModal();
          showDownloadToast('Browsing data cleared successfully');
        });
      }

      // Download Toast Helper
      function showDownloadToast(msg, duration = 4000) {
        if (!downloadToast) return;
        downloadToastText.textContent = msg;
        downloadToast.classList.add('active');
        if (toastDismissTimer) clearTimeout(toastDismissTimer);
        toastDismissTimer = setTimeout(() => {
          downloadToast.classList.remove('active');
        }, duration);
      }

      // Omnibox Navigation & Search Routing
      function navigateFromOmnibox(val) {
        const trimmed = (val || '').trim();
        if (!trimmed) return;
        hideSuggestions();

        let target = trimmed;
        if (!/^https?:\/\//i.test(trimmed) && !trimmed.startsWith('staunt://') && !trimmed.startsWith('file://')) {
          const isLocalhost = /^localhost(:\d+)?(\/.*)?$/i.test(trimmed);
          const isIpv4 = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(:\d+)?(\/.*)?$/.test(trimmed);
          const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?$/i.test(trimmed) && !trimmed.includes(' ');

          if (isLocalhost || isIpv4) {
            target = 'http://' + trimmed;
          } else if (isDomain) {
            target = 'https://' + trimmed;
          } else {
            target = 'http://127.0.0.1:5000/?q=' + encodeURIComponent(trimmed);
          }
        }
        api.navigateTo(target);
      }

      // Autocomplete Suggestions Engine
      async function fetchSuggestions(query) {
        if (!query || typeof api.getSuggestions !== 'function') {
          hideSuggestions();
          return;
        }
        try {
          const results = await api.getSuggestions(query);
          if (Array.isArray(results) && results.length > 0) {
            renderSuggestions(results);
          } else {
            hideSuggestions();
          }
        } catch (e) {
          hideSuggestions();
        }
      }

      function renderSuggestions(items) {
        suggestionsList = items;
        selectedSuggestIndex = -1;
        omniboxDropdown.innerHTML = '';

        items.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.dataset.index = index;

          const isHistory = item.type === 'history';
          const iconSvg = isHistory
            ? '<svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
            : '<svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';

          div.innerHTML = `
            ${iconSvg}
            <span class="suggestion-text">${escapeHtml(item.text || item.url || '')}</span>
            <span class="suggestion-type">${isHistory ? 'History' : 'Search'}</span>
          `;

          div.addEventListener('click', () => {
            if (item.url) api.navigateTo(item.url);
            else navigateFromOmnibox(item.text);
          });

          omniboxDropdown.appendChild(div);
        });

        omniboxDropdown.style.display = 'block';
      }

      function hideSuggestions() {
        if (omniboxDropdown) {
          omniboxDropdown.style.display = 'none';
          omniboxDropdown.innerHTML = '';
        }
        suggestionsList = [];
        selectedSuggestIndex = -1;
      }

      omnibox.addEventListener('input', () => {
        const val = omnibox.value.trim();
        if (suggestDebounceTimer) clearTimeout(suggestDebounceTimer);
        if (!val || val.startsWith('staunt://')) {
          hideSuggestions();
          return;
        }
        suggestDebounceTimer = setTimeout(() => fetchSuggestions(val), 120);
      });

      omnibox.addEventListener('keydown', (e) => {
        if (omniboxDropdown.style.display === 'block' && suggestionsList.length > 0) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedSuggestIndex = (selectedSuggestIndex + 1) % suggestionsList.length;
            updateSelectedSuggestion();
            return;
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedSuggestIndex = (selectedSuggestIndex - 1 + suggestionsList.length) % suggestionsList.length;
            updateSelectedSuggestion();
            return;
          } else if (e.key === 'Escape') {
            e.preventDefault();
            hideSuggestions();
            return;
          }
        }

        if (e.key === 'Enter') {
          if (selectedSuggestIndex >= 0 && selectedSuggestIndex < suggestionsList.length) {
            const item = suggestionsList[selectedSuggestIndex];
            if (item.url) api.navigateTo(item.url);
            else navigateFromOmnibox(item.text);
          } else {
            navigateFromOmnibox(omnibox.value);
          }
        }
      });

      function updateSelectedSuggestion() {
        const items = omniboxDropdown.querySelectorAll('.suggestion-item');
        items.forEach((item, idx) => {
          if (idx === selectedSuggestIndex) {
            item.classList.add('selected');
            const chosen = suggestionsList[idx];
            if (chosen) omnibox.value = chosen.text || chosen.url;
          } else {
            item.classList.remove('selected');
          }
        });
      }

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.omnibox-container')) {
          hideSuggestions();
        }
      });

      omnibox.addEventListener('focus', () => omnibox.select());

      // Render Tabs in Tab Rail
      function renderTabs() {
        const addBtn = btnAddTab;
        tabRail.innerHTML = '';
        currentTabs.forEach(tab => {
          const tabEl = document.createElement('div');
          tabEl.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '') + (tab.isPinned ? ' pinned' : '');
          tabEl.dataset.id = tab.id;

          const isNew = !tab.url || tab.url.includes('newtab.html') || tab.url.startsWith('staunt://');
          const title = tab.title || (isNew ? 'New Tab' : tab.url);

          let audioIconHtml = '';
          if (tab.isAudioPlaying || tab.isMuted) {
            audioIconHtml = `
              <button class="tab-audio-btn" title="${tab.isMuted ? 'Unmute' : 'Mute'}" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0;display:flex;align-items:center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  ${tab.isMuted 
                    ? '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' 
                    : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>'}
                </svg>
              </button>
            `;
          }

          let pinIconHtml = tab.isPinned ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.7;margin-right:2px;"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>' : '';

          tabEl.innerHTML = `
            ${pinIconHtml}
            <span class="tab-title">${escapeHtml(title)}</span>
            ${audioIconHtml}
            ${!tab.isPinned ? '<button class="tab-close" title="Close">×</button>' : ''}
          `;

          tabEl.addEventListener('click', () => api.switchTab(tab.id));
          
          // Right click -> Tab context menu
          tabEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (typeof api.showTabContextMenu === 'function') {
              api.showTabContextMenu(tab.id);
            }
          });

          // Middle click -> Close tab
          tabEl.addEventListener('auxclick', (e) => {
            if (e.button === 1) {
              e.preventDefault();
              api.closeTab(tab.id);
            }
          });

          const closeBtn = tabEl.querySelector('.tab-close');
          if (closeBtn) {
            closeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              api.closeTab(tab.id);
            });
          }

          const audioBtn = tabEl.querySelector('.tab-audio-btn');
          if (audioBtn) {
            audioBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              api.toggleMuteTab(tab.id);
            });
          }

          tabRail.appendChild(tabEl);
        });
        tabRail.appendChild(addBtn);
      }

      // Listen for Tab Creation from Main Process
      if (typeof api.onTabCreated === 'function') {
        api.onTabCreated((tab) => {
          if (!currentTabs.some(t => t.id === tab.id)) {
            currentTabs.push(tab);
          }
          activeTabId = tab.id;
          renderTabs();
        });
      }

      // Listen for Tab Updates (title, url, flags)
      if (typeof api.onTabUpdated === 'function') {
        api.onTabUpdated((tab) => {
          const idx = currentTabs.findIndex(t => t.id === tab.id);
          if (idx !== -1) {
            currentTabs[idx] = { ...currentTabs[idx], ...tab };
          } else {
            currentTabs.push(tab);
          }
          if (tab.id === activeTabId && tab.url) {
            if (!tab.url.includes('newtab.html') && !tab.url.startsWith('staunt://')) {
              omnibox.value = tab.url;
            } else {
              omnibox.value = '';
            }
          }
          renderTabs();
        });
      }

      // Listen for Tab Switch
      if (typeof api.onTabSwitched === 'function') {
        api.onTabSwitched(({ tabId, activeTabId: switchedId, url }) => {
          activeTabId = switchedId || tabId;
          if (url && !url.includes('newtab.html') && !url.startsWith('staunt://')) {
            omnibox.value = url;
          } else {
            omnibox.value = '';
          }
          renderTabs();
        });
      }

      // Listen for Tab Closed
      if (typeof api.onTabClosed === 'function') {
        api.onTabClosed((closedId) => {
          const tabId = typeof closedId === 'object' ? closedId.tabId : closedId;
          currentTabs = currentTabs.filter(t => t.id !== tabId);
          renderTabs();
        });
      }

      // Listen for Omnibox URL Updates & Loading States
      if (typeof api.onUrlUpdated === 'function') {
        api.onUrlUpdated((data) => {
          if (data) {
            if (data.url && !data.url.includes('newtab.html') && !data.url.startsWith('staunt://')) {
              omnibox.value = data.url;
              if (data.url.startsWith('https://')) {
                lockIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>';
              } else {
                lockIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
              }
            } else {
              omnibox.value = '';
              lockIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>';
            }

            // Update Back/Forward button disabled state if provided
            if (typeof data.canGoBack === 'boolean') {
              document.getElementById('btnDeskBack').disabled = !data.canGoBack;
            }
            if (typeof data.canGoForward === 'boolean') {
              document.getElementById('btnDeskFwd').disabled = !data.canGoForward;
            }

            // Loading / Stop icon toggle
            if (data.isLoading) {
              isPageLoading = true;
              if (iconReload) iconReload.style.display = 'none';
              if (iconStop) iconStop.style.display = 'block';
              progressLine.classList.add('active');
              progressLine.style.width = '70%';
            } else {
              isPageLoading = false;
              if (iconReload) iconReload.style.display = 'block';
              if (iconStop) iconStop.style.display = 'none';
              progressLine.style.width = '100%';
              setTimeout(() => {
                progressLine.classList.remove('active');
                setTimeout(() => { progressLine.style.width = '0%'; }, 200);
              }, 250);
            }
          }
        });
      }

      // Listen for Shield Tracking Stats
      if (typeof api.onShieldUpdated === 'function') {
        api.onShieldUpdated((stats) => {
          if (stats && typeof stats.trackersBlocked === 'number') {
            shieldCount.textContent = stats.trackersBlocked + ' Blocked';
          }
        });
      }

      // Download Progress & Completion Listeners
      if (typeof api.onDownloadProgress === 'function') {
        api.onDownloadProgress((data) => {
          if (data && data.fileName) {
            showDownloadToast(`Downloading: ${data.fileName} (${data.percent || 0}%)`, 2500);
          }
        });
      }

      if (typeof api.onDownloadComplete === 'function') {
        api.onDownloadComplete((data) => {
          if (data && data.fileName) {
            showDownloadToast(`Download complete: ${data.fileName}`, 5000);
          }
        });
      }

      // Global Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // Ctrl+L or Ctrl+K or Ctrl+E -> Focus Omnibox
        if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'k' || e.key === 'e')) {
          e.preventDefault();
          omnibox.focus();
          omnibox.select();
        }
        // Ctrl+T -> New Tab
        else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 't') {
          e.preventDefault();
          api.createTab('staunt://newtab');
        }
        // Ctrl+Shift+T -> Undo Close Tab
        else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'T' || e.key === 't')) {
          e.preventDefault();
          api.undoCloseTab();
        }
        // Ctrl+W -> Close Tab
        else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'w') {
          e.preventDefault();
          if (activeTabId) api.closeTab(activeTabId);
        }
        // Alt+Left -> Back
        else if (e.altKey && e.key === 'ArrowLeft') {
          e.preventDefault();
          api.goBack();
        }
        // Alt+Right -> Forward
        else if (e.altKey && e.key === 'ArrowRight') {
          e.preventDefault();
          api.goForward();
        }
        // Alt+Home -> Home
        else if (e.altKey && e.key === 'Home') {
          e.preventDefault();
          api.goHome();
        }
        // Ctrl+Shift+Delete -> Open Clear Browsing Data
        else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'Delete' || e.key === 'Del')) {
          e.preventDefault();
          openSettingsModal();
        }
      });

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

    })();
  </script>
</body>
</html>
