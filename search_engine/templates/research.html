<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VASTUDA Research — Scientific Consensus & Literature Synthesis</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="description" content="Academic research paper discovery, scientific consensus synthesis, and evidence analysis powered by VASTUDA." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=11" />
  <style>
    .research-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      width: 100%;
    }
    .research-hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .research-hero h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .research-hero p {
      color: var(--text-secondary);
      font-size: 15px;
    }
    .research-search-bar {
      margin-bottom: 36px;
    }
    .research-synth-card {
      background: var(--overview-bg);
      border: 1px solid var(--overview-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 32px;
    }
    .synth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .synth-badge {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }
    .synth-summary {
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-primary);
      margin-bottom: 22px;
    }
    .synth-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .findings-list {
      list-style: none;
      padding: 0;
      margin-bottom: 22px;
    }
    .findings-list li {
      padding: 10px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 14px;
      color: var(--text-primary);
    }
    .paper-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .paper-item {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      transition: all 0.2s ease;
    }
    .paper-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .paper-title {
      font-size: 16.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .paper-snippet {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .paper-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="brand-logo" onclick="window.location.href='/'" style="cursor: pointer;">
      <div class="logo-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><circle cx="11" cy="11" r="3" fill="currentColor"/></svg>
      </div>
      <div class="brand-text-wrap">
        <span class="brand-name">VASTUDA</span>
        <span class="brand-badge">RESEARCH</span>
      </div>
    </div>

    <nav class="header-nav-links" style="display: flex; align-items: center; gap: 18px; margin-left: 12px;">
      <a href="/" class="nav-link" style="font-size: 13.5px; font-weight: 500; color: var(--text-secondary); text-decoration: none;">Search</a>
      <a href="/discover" class="nav-link" style="font-size: 13.5px; font-weight: 500; color: var(--text-secondary); text-decoration: none;">Discover</a>
      <a href="/research" class="nav-link active" style="font-size: 13.5px; font-weight: 600; color: var(--text-primary); text-decoration: none;">Research</a>
    </nav>

    <div class="header-actions" style="margin-left: auto;">
      <a href="/download/windows" class="native-app-btn" title="Download VASTUDA Browser for Windows (.exe)" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(41, 151, 255, 0.12); color: var(--accent); border: 1px solid rgba(41, 151, 255, 0.25); border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.95-1.801"/></svg>
        <span>Windows</span>
      </a>
      <a href="/download/android" class="native-app-btn" title="Download VASTUDA Browser for Android (.apk)" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(52, 199, 89, 0.12); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.25); border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.4111 13.8533 8.086 12 8.086s-3.5902.3251-5.1368.8637L4.8409 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/></svg>
        <span>Android</span>
      </a>
      <button class="icon-btn" id="themeToggle" title="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <!-- RESEARCH CONTAINER -->
  <main class="research-container">
    <div class="research-hero">
      <h1>VASTUDA Research</h1>
      <p>Multi-source scientific consensus, peer-reviewed literature synthesis, and methodology breakdown.</p>
    </div>

    <!-- Search Input -->
    <div class="research-search-bar">
      <form class="search-form" id="researchForm" style="max-width: 100%;">
        <input 
          type="text" 
          id="researchInput" 
          class="search-input" 
          placeholder="Enter research topic, paper title, biological process, or AI model..." 
          autocomplete="off" 
          required 
          autofocus
        />
        <button type="submit" class="search-btn">Synthesize 🔬</button>
      </form>
    </div>

    <!-- Results Area -->
    <div id="researchResults">
      <!-- Default state hints -->
      <div style="text-align: center; color: var(--text-secondary); padding: 40px 20px;">
        <p style="margin-bottom: 12px; font-size: 15px;">Explore scientific literature with source-grounded evidence:</p>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button class="pill" onclick="searchTopic('Transformers attention mechanisms in deep learning')">Transformers Attention</button>
          <button class="pill" onclick="searchTopic('CRISPR Cas9 gene editing clinical trials')">CRISPR Gene Editing</button>
          <button class="pill" onclick="searchTopic('Quantum error correction surface codes')">Quantum Error Correction</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const theme = localStorage.getItem("vastuda_theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("vastuda_theme", next);
    });

    const researchForm = document.getElementById("researchForm");
    const researchInput = document.getElementById("researchInput");
    const researchResults = document.getElementById("researchResults");

    function searchTopic(query) {
      researchInput.value = query;
      executeResearch(query);
    }

    researchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = researchInput.value.trim();
      if (q) executeResearch(q);
    });

    async function executeResearch(query) {
      researchResults.innerHTML = '<div class="loading-box">Synthesizing peer-reviewed consensus and academic sources...</div>';
      try {
        const resp = await fetch(`/api/search?category=research&q=${encodeURIComponent(query)}`);
        const data = await resp.json();
        const rData = data.research || {};
        const results = data.results || [];

        let html = '';

        // Synthesis Card
        if (rData.summary || (rData.key_findings && rData.key_findings.length > 0)) {
          html += `
            <div class="research-synth-card">
              <div class="synth-header">
                <span class="synth-badge">Scientific Consensus Synthesis</span>
                <span style="font-size: 12px; color: var(--text-muted);">${results.length} Sources Analyzed</span>
              </div>
              <div class="synth-summary">${escapeHtml(rData.summary || '')}</div>
          `;

          if (rData.key_findings && rData.key_findings.length > 0) {
            html += `
              <div class="synth-section-title">Key Empirical Findings</div>
              <ul class="findings-list">
                ${rData.key_findings.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
              </ul>
            `;
          }

          if (rData.methodology_and_evidence) {
            html += `
              <div class="synth-section-title">Methodology & Datasets</div>
              <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 16px;">${escapeHtml(rData.methodology_and_evidence)}</p>
            `;
          }

          if (rData.counter_arguments_limitations) {
            html += `
              <div class="synth-section-title">Limitations & Open Debates</div>
              <p style="font-size: 13.5px; color: var(--text-secondary);">${escapeHtml(rData.counter_arguments_limitations)}</p>
            `;
          }

          html += `</div>`;
        }

        // Sources List
        if (results.length > 0) {
          html += `<div class="synth-section-title" style="margin-bottom: 16px;">Cited Academic & Technical Literature</div><div class="paper-list">`;
          results.forEach((item, idx) => {
            html += `
              <div class="paper-item">
                <div class="paper-meta">
                  <span>Source [${idx + 1}] • ${escapeHtml(item.domain || 'academic')}</span>
                  <span>${item.published_date || 'Literature'}</span>
                </div>
                <h3 class="paper-title">
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                </h3>
                <p class="paper-snippet">${escapeHtml(item.snippet)}</p>
                <div style="text-align: right;">
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="font-size: 12.5px; font-weight: 600;">View Publication ➔</a>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }

        researchResults.innerHTML = html;
      } catch (err) {
        researchResults.innerHTML = `<div class="loading-box">Error performing synthesis: ${err.message}</div>`;
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Auto run if ?q= passed
    const p = new URLSearchParams(window.location.search);
    const initQ = p.get("q");
    if (initQ) {
      researchInput.value = initQ;
      executeResearch(initQ);
    }
  </script>
</body>
</html>
