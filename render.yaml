services:
  - type: web
    name: staunt-search
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60

    autoDeploy: true

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: FLASK_ENV
        value: production

      - key: ALLOWED_ORIGINS
        value: https://staunt.vercel.app

      - key: SECRET_KEY
        generateValue: true

      - key: GROQ_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false
