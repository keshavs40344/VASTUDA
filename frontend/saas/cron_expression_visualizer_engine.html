<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">
  <header class="w-full max-w-4xl mb-6">
    <h1 class="text-3xl font-semibold flex items-center gap-2">
      <i data-lucide="clock"></i> Cron Schedule Visualizer &amp; Human Translator
    </h1>
  </header>

  <main class="w-full max-w-4xl space-y-6">
    <!-- Presets -->
    <section class="bg-gray-800 p-4 rounded-lg">
      <label class="block mb-2 font-medium">Presets</label>
      <select id="presetSelect" class="w-full bg-gray-700 text-gray-100 p-2 rounded">
        <option value="">-- Choose a preset --</option>
        <option value="* * * * *">Every minute</option>
        <option value="0 * * * *">Hourly</option>
        <option value="0 0 * * *">Daily at 00:00</option>
        <option value="0 12 * * *">Daily at 12:00</option>
        <option value="0 0 * * 0">Weekly on Sunday at 00:00</option>
        <option value="0 0 1 * *">Monthly on the 1st</option>
        <option value="0 0 1 1 *">Yearly on Jan 1st</option>
        <option value="*/5 * * * *">Every 5 minutes</option>
        <option value="0 */2 * * *">Every 2 hours</option>
        <option value="30 9 * * 1-5">Weekdays at 09:30</option>
      </select>
    </section>

    <!-- Cron Builder -->
    <section class="bg-gray-800 p-4 rounded-lg grid grid-cols-1 md:grid-cols-5 gap-4">
      <div>
        <label class="block mb-1 font-medium">Minute</label>
        <input type="text" id="minute" placeholder="* or 0-59" class="w-full bg-gray-700 p-2 rounded focus:outline-none">
      </div>
      <div>
        <label class="block mb-1 font-medium">Hour</label>
        <input type="text" id="hour" placeholder="* or 0-23" class="w-full bg-gray-700 p-2 rounded focus:outline-none">
      </div>
      <div>
        <label class="block mb-1 font-medium">Day of month</label>
        <input type="text" id="dayOfMonth" placeholder="* or 1-31" class="w-full bg-gray-700 p-2 rounded focus:outline-none">
      </div>
      <div>
        <label class="block mb-1 font-medium">Month</label>
        <input type="text" id="month" placeholder="* or 1-12" class="w-full bg-gray-700 p-2 rounded focus:outline-none">
      </div>
      <div>
        <label class="block mb-1 font-medium">Day of week</label>
        <input type="text" id="dayOfWeek" placeholder="* or 0-6 (Sun=0)" class="w-full bg-gray-700 p-2 rounded focus:outline-none">
      </div>
    </section>

    <!-- Output Cards -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Cron Expression -->
      <div class="bg-gray-800 p-4 rounded-lg flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <h2 class="font-medium">Cron Expression</h2>
          <button id="copyCron" class="flex items-center gap-1 text-sm text-gray-400 hover:text-gray-200">
            <i data-lucide="copy"></i>Copy
          </button>
        </div>
        <code id="cronOutput" class="bg-gray-900 p-2 rounded text-green-400 break-all select-all"></code>
      </div>

      <!-- Human Readable -->
      <div class="bg-gray-800 p-4 rounded-lg flex flex-col">
        <h2 class="font-medium mb-2">Human‑readable description</h2>
        <p id="humanOutput" class="text-gray-300"></p>
      </div>
    </section>

    <!-- Next 10 executions -->
    <section class="bg-gray-800 p-4 rounded-lg">
      <h2 class="font-medium mb-2 flex items-center gap-2">
        <i data-lucide="calendar"></i>Next 10 executions
      </h2>
      <ul id="nextRuns" class="list-disc list-inside text-gray-300 space-y-1"></ul>
    </section>

    <!-- Error Message -->
    <section id="errorSection" class="hidden bg-red-900/50 p-3 rounded-lg">
      <p id="errorMessage" class="text-red-200"></p>
    </section>
  </main>

  <script>
    // Initialize icons
    lucide.createIcons();

    const fields = {
      minute: { min: 0, max: 59 },
      hour: { min: 0, max: 23 },
      dayOfMonth: { min: 1, max: 31 },
      month: { min: 1, max: 12 },
      dayOfWeek: { min: 0, max: 6 }
    };

    const inputs = {
      minute: document.getElementById('minute'),
      hour: document.getElementById('hour'),
      dayOfMonth: document.getElementById('dayOfMonth'),
      month: document.getElementById('month'),
      dayOfWeek: document.getElementById('dayOfWeek')
    };

    const presetSelect = document.getElementById('presetSelect');
    const cronOutput = document.getElementById('cronOutput');
    const humanOutput = document.getElementById('humanOutput');
    const nextRuns = document.getElementById('nextRuns');
    const errorSection = document.getElementById('errorSection');
    const errorMessage = document.getElementById('errorMessage');
    const copyCronBtn = document.getElementById('copyCron');

    // Helper: parse a single cron field into a Set of numbers
    function parseField(str, min, max) {
      const result = new Set();
      if (!str) throw new Error('Empty field');
      const parts = str.split(',');
      for (let part of parts) {
        part = part.trim();
        if (part === '*') {
          for (let i = min; i <= max; i++) result.add(i);
        } else if (part.includes('/')) {
          const [range, stepStr] = part.split('/');
          const step = Number(stepStr);
          if (isNaN(step) || step <= 0) throw new Error('Invalid step');
          let rangeStart = min, rangeEnd = max;
          if (range !== '*') {
            if (range.includes('-')) {
              const [s, e] = range.split('-').map(Number);
              rangeStart = s; rangeEnd = e;
            } else {
              rangeStart = rangeEnd = Number(range);
            }
          }
          for (let i = rangeStart; i <= rangeEnd; i++) {
            if ((i - rangeStart) % step === 0) result.add(i);
          }
        } else if (part.includes('-')) {
          const [s, e] = part.split('-').map(Number);
          if (isNaN(s) || isNaN(e) || s > e) throw new Error('Invalid range');
          for (let i = s; i <= e; i++) {
            if (i >= min && i <= max) result.add(i);
          }
        } else {
          const val = Number(part);
          if (isNaN(val) || val < min || val > max) throw new Error('Value out of bounds');
          result.add(val);
        }
      }
      return result;
    }

    // Human readable translation
    function translate(cronParts) {
      const [min, hour, dom, mon, dow] = cronParts;
      const parts = [];

      // Minutes
      if (min === '*') parts.push('every minute');
      else if (min.size === 1) parts.push(`at minute ${[...min][0]}`);
      else parts.push(`at minutes ${[...min].join(', ')}`);

      // Hours
      if (hour === '*') parts.push('every hour');
      else if (hour.size === 1) parts.push(`at hour ${[...hour][0]}`);
      else parts.push(`at hours ${[...hour].join(', ')}`);

      // Day of month
      if (dom === '*') parts.push('every day of month');
      else if (dom.size === 1) parts.push(`on day ${[...dom][0]} of month`);
      else parts.push(`on days ${[...dom].join(', ')} of month`);

      // Month
      if (mon === '*') parts.push('every month');
      else if (mon.size === 1) parts.push(`in month ${[...mon][0]}`);
      else parts.push(`in months ${[...mon].join(', ')}`);

      // Day of week
      const dowNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      if (dow === '*') parts.push('every day of week');
      else if (dow.size === 1) parts.push(`on ${dowNames[[...dow][0]]}`);
      else parts.push(`on ${[...dow].map(i=>dowNames[i]).join(', ')}`);

      return parts.join(', ');
    }

    // Generate next N runs
    function getNextRuns(cronSets, count = 10) {
      const [minSet, hourSet, domSet, monSet, dowSet] = cronSets;
      const results = [];
      let now = new Date();
      now.setSeconds(0,0); // ignore seconds
      let attempts = 0;
      while (results.length < count && attempts < 100000) {
        attempts++;
        const minute = now.getMinutes();
        const hour = now.getHours();
        const day = now.getDate();
        const month = now.getMonth() + 1; // 1-12
        const dow = now.getDay(); // 0-6

        const match = minSet.has(minute) &&
                      hourSet.has(hour) &&
                      domSet.has(day) &&
                      monSet.has(month) &&
                      dowSet.has(dow);

        if (match) results.push(new Date(now));

        now.setMinutes(now.getMinutes() + 1);
      }
      return results;
    }

    // Main update function
    function update() {
      // Reset error UI
      errorSection.classList.add('hidden');
      Object.values(inputs).forEach(i => i.classList.remove('input-error'));

      try {
        const cronParts = [];
        const sets = [];

        for (const [key, cfg] of Object.entries(fields)) {
          const raw = inputs[key].value.trim() || '*';
          const set = parseField(raw, cfg.min, cfg.max);
          sets.push(set);
          // Build string part for output
          const partStr = raw;
          cronParts.push(partStr);
        }

        const cronString = cronParts.join(' ');
        cronOutput.textContent = cronString;

        // Human readable
        humanOutput.textContent = translate(sets);

        // Next runs
        const next = getNextRuns(sets, 10);
        nextRuns.innerHTML = '';
        next.forEach(dt => {
          const li = document.createElement('li');
          li.textContent = dt.toLocaleString();
          nextRuns.appendChild(li);
        });
      } catch (e) {
        // Show error
        errorMessage.textContent = e.message;
        errorSection.classList.remove('hidden');
        // Highlight offending fields (simple heuristic)
        for (const [key, input] of Object.entries(inputs)) {
          if (input.value && !/^[\d\*\/,\-]+$/.test(input.value.trim())) {
            input.classList.add('input-error');
          }
        }
      }
    }

    // Event listeners
    Object.values(inputs).forEach(inp => inp.addEventListener('input', update));
    presetSelect.addEventListener('change', () => {
      const val = presetSelect.value;
      if (!val) return;
      const parts = val.split(' ');
      const keys = Object.keys(fields);
      parts.forEach((p, i) => inputs[keys[i]].value = p);
      update();
    });

    copyCronBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(cronOutput.textContent);
        copyCronBtn.innerHTML = '<i data-lucide="check"></i>Copied';
        setTimeout(() => {
          copyCronBtn.innerHTML = '<i data-lucide="copy"></i>Copy';
          lucide.createIcons();
        }, 1500);
      } catch (err) {
        alert('Copy failed: ' + err);
      }
    });

    // Initial render
    update();
  </script>
</body>
</html>
