<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c13" />
  <title>Staunt Browser Ultra • Sovereign Cloud Browser</title>
  <link rel="manifest" href="/manifest.json" />

  <style>
    :root {
      --bg-root: #07090e;
      --bg-toolbar: rgba(13, 16, 25, 0.96);
      --bg-omnibox: rgba(255, 255, 255, 0.07);
      --bg-omnibox-hover: rgba(255, 255, 255, 0.12);
      --bg-omnibox-focus: rgba(255, 255, 255, 0.15);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(139, 92, 246, 0.6);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --text-white: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.4);
      --header-h: 40px;
      --tabs-h: 30px;
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-root);
      font-family: var(--font-system);
      color: var(--text-white);
      user-select: none;
    }

    /* ─── HOVER TRIGGER ZONE FOR AUTO-HIDE TOOLBAR ─── */
    .top-hover-trigger {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      z-index: 10000;
    }

    /* ─── CHROME-STYLE FLOATING APP HEADER ─── */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: var(--bg-toolbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 9999;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.immersive-mode .app-header {
      transform: translateY(-100%);
    }

    .top-hover-trigger:hover + .app-header,
    .app-header:hover {
      transform: translateY(0) !important;
    }

    /* Floating micro toggle when bar is hidden */
    .immersive-floating-pill {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 24, 38, 0.9);
      border: 0.5px solid var(--border-subtle);
      color: var(--text-white);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 9998;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }

    body.immersive-mode .immersive-floating-pill {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Controls: Back, Forward, Refresh, Home */
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .btn-nav-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-nav-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-white);
    }

    .btn-nav-icon svg {
      width: 14px;
      height: 14px;
    }

    /* Omnibox */
    .omnibox-wrapper {
      flex: 1;
      max-width: 720px;
      height: 28px;
      background: var(--bg-omnibox);
      border: 0.5px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .omnibox-wrapper:hover {
      background: var(--bg-omnibox-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .omnibox-wrapper:focus-within {
      background: var(--bg-omnibox-focus);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .engine-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(139, 92, 246, 0.15);
      cursor: pointer;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-size: 12px;
      font-family: inherit;
    }

    .omnibox-input::placeholder {
      color: var(--text-muted);
    }

    /* Right Action Buttons */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 0.5px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-white);
    }

    .btn-download-app {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff !important;
      border: none;
      font-weight: 600;
    }

    .btn-download-app:hover {
      opacity: 0.92;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ─── TABS STRIP ─── */
    .tabs-strip {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      height: var(--tabs-h);
      background: rgba(10, 12, 19, 0.95);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
      z-index: 9997;
      overflow-x: auto;
      scrollbar-width: none;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs-strip::-webkit-scrollbar { display: none; }

    body.immersive-mode .tabs-strip {
      transform: translateY(-200%);
    }

    .tab-pill {
      height: 22px;
      min-width: 100px;
      max-width: 180px;
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid transparent;
      border-radius: 6px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-white);
    }

    .tab-pill.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .tab-title-span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close-x {
      font-size: 11px;
      color: var(--text-muted);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-close-x:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-new-tab {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .btn-new-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* ─── PROGRESS BAR ─── */
    .progress-bar-strip {
      position: fixed;
      top: calc(var(--header-h) + var(--tabs-h));
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #38bdf8);
      z-index: 10001;
      transition: width 0.2s ease, opacity 0.25s ease;
      opacity: 0;
    }

    .progress-bar-strip.loading {
      opacity: 1;
    }

    body.immersive-mode .progress-bar-strip {
      top: 0;
    }

    /* ─── VIEWPORT CANVAS ─── */
    .viewport-canvas {
      position: fixed;
      top: calc(var(--header-h) + var(--tabs-h));
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      transition: top 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.immersive-mode .viewport-canvas {
      top: 0;
    }

    .tab-viewport {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    .tab-viewport.active {
      display: block;
    }

    .embed-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* ─── NEW TAB SPEED DIAL LAUNCHPAD ─── */
    .newtab-wall {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: radial-gradient(circle at 50% 25%, #151824 0%, #07090e 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .launch-clock {
      font-size: 54px;
      font-weight: 200;
      letter-spacing: -1.5px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
    }

    .launch-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: repeat(5, 100px);
      gap: 16px;
      margin-bottom: 32px;
    }

    @media (max-width: 600px) {
      .speed-grid {
        grid-template-columns: repeat(3, 90px);
        gap: 12px;
      }
    }

    .speed-tile {
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid var(--border-subtle);
      border-radius: 12px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .speed-tile:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tile-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }

    .tile-label {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
    }

    /* Showcase Row */
    .showcase-row {
      display: flex;
      gap: 16px;
      max-width: 640px;
      width: 100%;
    }

    @media (max-width: 640px) {
      .showcase-row {
        flex-direction: column;
      }
    }

    .showcase-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 0.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .showcase-card h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .showcase-card p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      flex: 1;
    }

    .showcase-btn {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .showcase-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Modal */
    .download-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      padding: 20px;
    }

    .download-modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #111420;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Top 8px hover zone for auto-hide toolbar -->
  <div class="top-hover-trigger"></div>

  <!-- Micro pill to restore toolbar when hidden -->
  <div class="immersive-floating-pill" id="btn-show-toolbar">
    ▼ Show Toolbar
  </div>

  <!-- Browser Chrome Bar -->
  <header class="app-header" id="main-header">
    <div class="nav-controls">
      <button class="btn-nav-icon" id="nav-back" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-forward" title="Forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-reload" title="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-home" title="New Tab Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
    </div>

    <!-- Omnibox -->
    <div class="omnibox-wrapper">
      <span class="engine-badge" id="engine-badge" title="Click to cycle search engine">G</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="text" class="omnibox-input" id="omnibox-input" placeholder="Search Google or enter address (e.g. youtube.com)" spellcheck="false" autocomplete="off" />
    </div>

    <div class="header-actions">
      <button class="action-btn" id="btn-toggle-immersive" title="Toggle Auto-Hide Toolbar (100% Screen Space)">
        ▲ Immersive
      </button>
      <button class="action-btn" id="btn-toggle-fs" title="True Full Screen">
        ⛶ Full Screen
      </button>
      <button class="action-btn btn-download-app" id="btn-open-download-modal">
        Get App (EXE / APK)
      </button>
    </div>
  </header>

  <!-- Tabs Strip -->
  <nav class="tabs-strip" id="tabs-strip">
    <div id="tabs-rail" style="display: flex; gap: 4px; align-items: center;"></div>
    <button class="btn-new-tab" id="btn-add-tab" title="New Tab">+</button>
  </nav>

  <!-- Progress Bar Strip -->
  <div class="progress-bar-strip" id="progress-strip"></div>

  <!-- Viewport Canvas -->
  <main class="viewport-canvas" id="viewport-canvas"></main>

  <!-- Download Modal -->
  <div class="download-modal-overlay" id="download-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Download Staunt Browser</h2>
        <span class="modal-close" id="modal-close-btn">✕</span>
      </div>
      <p style="font-size: 12px; color: var(--text-dim); line-height: 1.5;">
        Experience Staunt Browser natively on your desktop or smartphone with built-in hardware acceleration and zero ad/tracker overhead.
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/assets/Staunt-Browser-Setup.exe" download="Staunt-Browser-Setup.exe" class="showcase-btn" style="background: #8b5cf6;">
          🪟 Download Windows .EXE (5.6 KB Setup)
        </a>
        <a href="/assets/Staunt-Browser-Mobile.apk" download="Staunt-Browser-Mobile.apk" class="showcase-btn" style="background: #10b981;">
          📱 Download Android .APK (5.19 MB Universal)
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const SEARCH_ENGINES = {
        google: { name: 'G', url: 'https://www.google.com/search?q=' },
        duckduckgo: { name: '🦆', url: 'https://html.duckduckgo.com/html/?q=' },
        bing: { name: 'b', url: 'https://www.bing.com/search?q=' }
      };
      let currentEngineKey = 'google';

      let tabs = [];
      let activeTabId = null;
      let nextTabId = 1;

      const omnibox = document.getElementById('omnibox-input');
      const engineBadge = document.getElementById('engine-badge');
      const tabsRail = document.getElementById('tabs-rail');
      const canvas = document.getElementById('viewport-canvas');
      const progressStrip = document.getElementById('progress-strip');
      const btnImmersive = document.getElementById('btn-toggle-immersive');
      const btnShowToolbar = document.getElementById('btn-show-toolbar');
      const btnFs = document.getElementById('btn-toggle-fs');
      const downloadModal = document.getElementById('download-modal');

      // ─── ENGINE SWITCHER ───
      const engineKeys = Object.keys(SEARCH_ENGINES);
      engineBadge.addEventListener('click', () => {
        const nextIdx = (engineKeys.indexOf(currentEngineKey) + 1) % engineKeys.length;
        currentEngineKey = engineKeys[nextIdx];
        engineBadge.textContent = SEARCH_ENGINES[currentEngineKey].name;
        omnibox.placeholder = 'Search ' + currentEngineKey.toUpperCase() + ' or enter address';
      });

      // ─── PROGRESS BAR ───
      let progressTimer = null;
      function startProgress() {
        clearInterval(progressTimer);
        progressStrip.style.width = '15%';
        progressStrip.classList.add('loading');
        let p = 15;
        progressTimer = setInterval(() => {
          if (p < 85) {
            p += Math.random() * 18;
            progressStrip.style.width = Math.min(p, 85) + '%';
          }
        }, 120);
      }

      function finishProgress() {
        clearInterval(progressTimer);
        progressStrip.style.width = '100%';
        setTimeout(() => {
          progressStrip.classList.remove('loading');
          setTimeout(() => { progressStrip.style.width = '0%'; }, 200);
        }, 250);
      }

      // ─── URL RESOLVER ───
      function resolveTargetUrl(raw) {
        if (!raw) return '';
        let trimmed = raw.trim();
        if (!/^https?:\/\//i.test(trimmed)) {
          if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(trimmed) && !trimmed.includes(' ')) {
            trimmed = 'https://' + trimmed;
          } else {
            return SEARCH_ENGINES[currentEngineKey].url + encodeURIComponent(trimmed);
          }
        }

        // YouTube video watch & youtu.be optimizer
        try {
          const u = new URL(trimmed);
          if (u.hostname.includes('youtu.be')) {
            const vid = u.pathname.replace(/^\//, '').split('/')[0];
            if (vid) return 'https://www.youtube.com/embed/' + vid + '?autoplay=1&rel=0';
          } else if (u.hostname.includes('youtube.com')) {
            if (u.pathname === '/watch' && u.searchParams.get('v')) {
              return 'https://www.youtube.com/embed/' + u.searchParams.get('v') + '?autoplay=1&rel=0';
            } else if (u.pathname.startsWith('/shorts/')) {
              const vid = u.pathname.split('/shorts/')[1].split('/')[0];
              if (vid) return 'https://www.youtube.com/embed/' + vid + '?autoplay=1&rel=0';
            }
          }
        } catch(e) {}

        return trimmed;
      }

      function getDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, '');
        } catch(e) {
          return url || 'New Tab';
        }
      }

      // ─── TABS MANAGEMENT ───
      function createTab(initialUrl = '') {
        const id = nextTabId++;
        const tab = {
          id: id,
          url: initialUrl,
          title: initialUrl ? getDomain(initialUrl) : 'New Tab',
          isNewTab: !initialUrl
        };
        tabs.push(tab);

        buildTabViewport(tab);
        renderTabs();
        switchTab(id);

        if (initialUrl) {
          navigateTo(initialUrl, id);
        }
      }

      function switchTab(id) {
        activeTabId = id;
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;

        omnibox.value = tab.isNewTab ? '' : tab.url;

        document.querySelectorAll('.tab-viewport').forEach(vp => {
          vp.classList.toggle('active', String(vp.dataset.id) === String(id));
        });

        renderTabs();
      }

      function closeTab(id, e) {
        if (e) e.stopPropagation();
        const idx = tabs.findIndex(t => t.id === id);
        if (idx === -1) return;

        const vp = document.getElementById('viewport-' + id);
        if (vp) vp.remove();

        tabs.splice(idx, 1);

        if (tabs.length === 0) {
          createTab();
          return;
        }

        if (activeTabId === id) {
          const newIdx = Math.min(idx, tabs.length - 1);
          switchTab(tabs[newIdx].id);
        } else {
          renderTabs();
        }
      }

      function renderTabs() {
        tabsRail.innerHTML = '';
        tabs.forEach(tab => {
          const pill = document.createElement('div');
          pill.className = 'tab-pill' + (tab.id === activeTabId ? ' active' : '');
          pill.dataset.id = tab.id;
          pill.innerHTML = `
            <span class="tab-title-span">${escapeHtml(tab.title)}</span>
            <span class="tab-close-x" title="Close">✕</span>
          `;
          pill.addEventListener('click', () => switchTab(tab.id));
          pill.querySelector('.tab-close-x').addEventListener('click', (e) => closeTab(tab.id, e));
          tabsRail.appendChild(pill);
        });
      }

      function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ─── VIEWPORT DOM BUILDER ───
      function buildTabViewport(tab) {
        const vp = document.createElement('div');
        vp.className = 'tab-viewport';
        vp.id = 'viewport-' + tab.id;
        vp.dataset.id = tab.id;

        vp.innerHTML = `
          <div class="newtab-wall" id="wall-${tab.id}">
            <div class="launch-clock" id="clock-${tab.id}">--:--</div>
            <div class="launch-title">Staunt Browser Ultra</div>

            <div class="speed-grid">
              <div class="speed-tile" data-url="https://www.youtube.com">
                <div class="tile-icon" style="background: rgba(255,0,0,0.18); color: #ff453a;">▶</div>
                <div class="tile-label">YouTube</div>
              </div>
              <div class="speed-tile" data-url="https://www.google.com">
                <div class="tile-icon" style="background: rgba(66,133,244,0.18); color: #4285f4;">G</div>
                <div class="tile-label">Google</div>
              </div>
              <div class="speed-tile" data-url="https://www.github.com">
                <div class="tile-icon" style="background: rgba(255,255,255,0.15); color: #fff;">⌥</div>
                <div class="tile-label">GitHub</div>
              </div>
              <div class="speed-tile" data-url="https://www.wikipedia.org">
                <div class="tile-icon" style="background: rgba(255,255,255,0.15); color: #cbd5e1;">W</div>
                <div class="tile-label">Wikipedia</div>
              </div>
              <div class="speed-tile" data-url="https://www.reddit.com">
                <div class="tile-icon" style="background: rgba(255,69,0,0.18); color: #ff4500;">R</div>
                <div class="tile-label">Reddit</div>
              </div>
            </div>

            <div class="showcase-row">
              <div class="showcase-card">
                <h3>🪟 Windows Desktop App</h3>
                <p>Native Chromium runtime with hardware acceleration and ad/tracker shield.</p>
                <a href="/assets/Staunt-Browser-Setup.exe" download="Staunt-Browser-Setup.exe" class="showcase-btn">Download Windows .EXE</a>
              </div>
              <div class="showcase-card">
                <h3>📱 Android Mobile App</h3>
                <p>Universal signed APK supporting all phones with 1-tap installation.</p>
                <a href="/assets/Staunt-Browser-Mobile.apk" download="Staunt-Browser-Mobile.apk" class="showcase-btn">Download Android .APK</a>
              </div>
            </div>
          </div>

          <iframe 
            class="embed-frame" 
            id="frame-${tab.id}" 
            style="display: none;"
            allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen; microphone; camera; display-capture; geolocation"
          ></iframe>
        `;

        canvas.appendChild(vp);

        // Speed dials
        vp.querySelectorAll('.speed-tile').forEach(tile => {
          tile.addEventListener('click', () => {
            const u = tile.dataset.url;
            if (u) navigateTo(u, tab.id);
          });
        });

        updateClock(tab.id);
      }

      function updateClock(tabId) {
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const clockEl = document.getElementById('clock-' + tabId);
        if (clockEl) clockEl.textContent = `${h}:${m} ${ampm}`;
      }

      setInterval(() => {
        tabs.forEach(t => updateClock(t.id));
      }, 1000);

      // ─── NAVIGATION ENGINE ───
      function navigateTo(target, tabId = activeTabId) {
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;

        const resolved = resolveTargetUrl(target);
        if (!resolved) return;

        tab.url = resolved;
        tab.title = getDomain(resolved);
        tab.isNewTab = false;

        if (tabId === activeTabId) {
          omnibox.value = resolved;
        }
        renderTabs();

        const vp = document.getElementById('viewport-' + tab.id);
        if (vp) {
          const wall = vp.querySelector('.newtab-wall');
          const iframe = vp.querySelector('.embed-frame');

          if (wall) wall.style.display = 'none';
          if (iframe) {
            iframe.style.display = 'block';
            startProgress();

            let targetSrc = resolved;
            if (!resolved.includes('youtube.com/embed/')) {
              targetSrc = '/gateway?url=' + encodeURIComponent(resolved);
            }
            iframe.src = targetSrc;
            iframe.onload = () => finishProgress();
          }
        }
      }

      // ─── NAV CONTROLS ───
      document.getElementById('nav-back').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe && iframe.contentWindow) {
            try { iframe.contentWindow.history.back(); } catch(e) {}
          }
        }
      });

      document.getElementById('nav-forward').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe && iframe.contentWindow) {
            try { iframe.contentWindow.history.forward(); } catch(e) {}
          }
        }
      });

      document.getElementById('nav-reload').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe) {
            startProgress();
            iframe.src = iframe.src;
          }
        }
      });

      document.getElementById('nav-home').addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab) return;
        tab.url = '';
        tab.title = 'New Tab';
        tab.isNewTab = true;
        omnibox.value = '';
        renderTabs();

        const vp = document.getElementById('viewport-' + tab.id);
        if (vp) {
          const wall = vp.querySelector('.newtab-wall');
          const iframe = vp.querySelector('.embed-frame');
          if (wall) wall.style.display = 'flex';
          if (iframe) {
            iframe.style.display = 'none';
            iframe.src = 'about:blank';
          }
        }
      });

      // ─── REAL-TIME POSTMESSAGE URL & NAVIGATION SYNC ───
      window.addEventListener('message', (event) => {
        if (!event.data) return;

        if (event.data.type === 'STAUNT_URL_CHANGE') {
          const rawUrl = event.data.url;
          let cleanUrl = rawUrl;
          if (rawUrl.includes('/gateway?url=')) {
            cleanUrl = decodeURIComponent(rawUrl.split('/gateway?url=')[1]);
          } else if (rawUrl.startsWith(window.location.origin)) {
            const relPath = rawUrl.slice(window.location.origin.length);
            const activeUpstream = getCookie('staunt_upstream') || 'https://www.youtube.com';
            cleanUrl = activeUpstream + relPath;
          }

          const tab = tabs.find(t => t.id === activeTabId);
          if (tab) {
            tab.url = cleanUrl;
            if (event.data.title) {
              tab.title = event.data.title;
              document.title = event.data.title + ' • Staunt Browser';
            }
            if (document.activeElement !== omnibox) {
              omnibox.value = cleanUrl;
            }
            renderTabs();
          }
        } else if (event.data.type === 'STAUNT_NAVIGATE') {
          if (event.data.url) {
            navigateTo(event.data.url);
            if (event.data.rawUrl && document.activeElement !== omnibox) {
              omnibox.value = event.data.rawUrl;
            }
          }
        }
      });

      function getCookie(name) {
        const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
        return v ? v[2] : null;
      }

      // ─── OMNIBOX SUBMIT ───
      omnibox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = omnibox.value.trim();
          if (val) navigateTo(val);
        }
      });

      document.getElementById('btn-add-tab').addEventListener('click', () => createTab());

      // ─── IMMERSIVE MODE TOGGLE ───
      let isImmersive = false;
      function toggleImmersive(val) {
        isImmersive = typeof val === 'boolean' ? val : !isImmersive;
        document.body.classList.toggle('immersive-mode', isImmersive);
        btnImmersive.textContent = isImmersive ? '▼ Show Bar' : '▲ Immersive';
      }

      btnImmersive.addEventListener('click', () => toggleImmersive());
      btnShowToolbar.addEventListener('click', () => toggleImmersive(false));

      // ─── FULLSCREEN ───
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          toggleImmersive(true);
        } else {
          document.exitFullscreen().catch(() => {});
          toggleImmersive(false);
        }
      }
      btnFs.addEventListener('click', toggleFullscreen);

      // Auto fullscreen on first touch for app feel
      function autoFsPrompt() {
        if (!document.fullscreenElement && window.innerWidth < 768) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }
      window.addEventListener('touchstart', autoFsPrompt, { once: true });

      // ─── DOWNLOAD MODAL ───
      const btnModal = document.getElementById('btn-open-download-modal');
      const modalClose = document.getElementById('modal-close-btn');

      btnModal.addEventListener('click', () => downloadModal.classList.add('open'));
      modalClose.addEventListener('click', () => downloadModal.classList.remove('open'));
      downloadModal.addEventListener('click', (e) => {
        if (e.target === downloadModal) downloadModal.classList.remove('open');
      });

      // Initialize initial tab
      createTab();
    })();
  </script>
</body>
</html>
