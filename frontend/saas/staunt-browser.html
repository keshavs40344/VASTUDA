<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Staunt Browser Ultra • Pure Web Engine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#090a0f" />

  <style>
    :root {
      --bg-chrome: #0d0f17;
      --bg-omnibox: rgba(255, 255, 255, 0.05);
      --bg-omnibox-hover: rgba(255, 255, 255, 0.08);
      --bg-omnibox-focus: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-focus: rgba(139, 92, 246, 0.5);
      --text-white: #ffffff;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --header-h: 46px;
      --tabs-h: 36px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      user-select: none;
    }

    /* ─── APP HEADER / CHROME ─── */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: rgba(13, 15, 23, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      z-index: 10000;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.immersive-mode .app-header {
      transform: translateY(-100%);
    }

    /* Navigation Icon Controls */
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-nav-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-nav-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-white);
    }

    .btn-nav-icon:active {
      transform: scale(0.92);
    }

    .btn-nav-icon svg {
      width: 15px;
      height: 15px;
    }

    /* Omnibox Floating Bar */
    .omnibox-wrapper {
      flex: 1;
      height: 32px;
      background: var(--bg-omnibox);
      border: 0.5px solid var(--border-subtle);
      border-radius: 9px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .omnibox-wrapper:hover {
      background: var(--bg-omnibox-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .omnibox-wrapper:focus-within {
      background: var(--bg-omnibox-focus);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
    }

    .engine-badge {
      font-size: 11px;
      font-weight: 700;
      color: #a78bfa;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(139, 92, 246, 0.16);
      cursor: pointer;
    }

    .ssl-lock {
      width: 13px;
      height: 13px;
      color: #34d399;
      flex-shrink: 0;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-size: 13px;
      font-family: inherit;
    }

    .omnibox-input::placeholder {
      color: var(--text-muted);
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 0.5px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-white);
    }

    .btn-download-app {
      background: var(--accent-gradient);
      color: #fff !important;
      border: none;
      font-weight: 600;
    }

    .btn-download-app:hover {
      opacity: 0.92;
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.4);
    }

    /* ─── TABS STRIP ─── */
    .tabs-strip {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      height: var(--tabs-h);
      background: rgba(10, 12, 18, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 5px;
      z-index: 9997;
      overflow-x: auto;
      scrollbar-width: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs-strip::-webkit-scrollbar { display: none; }

    body.immersive-mode .tabs-strip {
      transform: translateY(-200%);
    }

    .tab-pill {
      height: 26px;
      min-width: 120px;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.03);
      border: 0.5px solid transparent;
      border-radius: 7px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .tab-pill:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-white);
    }

    .tab-pill.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .tab-favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title-span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close-x {
      font-size: 12px;
      color: var(--text-muted);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-close-x:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-new-tab {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: transparent;
      border: 0.5px solid transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-new-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Progress Strip */
    .progress-bar-strip {
      position: fixed;
      top: calc(var(--header-h) + var(--tabs-h));
      left: 0;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899, #3b82f6);
      z-index: 10001;
      transition: width 0.15s ease, opacity 0.25s ease;
    }

    .progress-bar-strip.loading {
      opacity: 1;
    }

    /* ─── VIEWPORT CANVAS ─── */
    .viewport-canvas {
      position: fixed;
      top: calc(var(--header-h) + var(--tabs-h));
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      overflow: hidden;
      transition: top 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.immersive-mode .viewport-canvas {
      top: 0;
    }

    .tab-viewport {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      background: #090a0f;
    }

    .tab-viewport.active {
      display: block;
    }

    .embed-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }

    /* ─── NEW TAB LUXURY LAUNCHPAD ─── */
    .newtab-wall {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #151828 0%, #08090e 100%);
      padding: 30px 20px;
      overflow-y: auto;
      text-align: center;
    }

    .launch-clock {
      font-size: 58px;
      font-weight: 200;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: -1.5px;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .launch-greeting {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 580px;
      width: 100%;
      margin-bottom: 36px;
    }

    @media (max-width: 600px) {
      .speed-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    .speed-tile {
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .speed-tile:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .tile-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .tile-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
    }

    /* App Showcase Banner */
    .app-badge-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .app-badge-card {
      background: rgba(255, 255, 255, 0.03);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }

    .app-badge-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .badge-btn {
      background: var(--accent-gradient);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
    }

    /* Download Modal */
    .download-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      padding: 20px;
    }

    .download-modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #10121d;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Browser Chrome Bar -->
  <header class="app-header" id="main-header">
    <div class="nav-controls">
      <button class="btn-nav-icon" id="nav-back" title="Back (Alt+Left)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-forward" title="Forward (Alt+Right)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-reload" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-home" title="New Tab Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button class="btn-nav-icon" id="nav-popout" title="Open Page in Dedicated Window (100% Native Speed)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </div>

    <!-- Omnibox -->
    <div class="omnibox-wrapper">
      <span class="engine-badge" id="engine-badge" title="Click to cycle search engine">G</span>
      <svg class="ssl-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="text" class="omnibox-input" id="omnibox-input" placeholder="Search Google or enter any address (e.g. youtube.com, wikipedia.org)" spellcheck="false" autocomplete="off" />
    </div>

    <div class="header-actions">
      <button class="action-btn" id="btn-toggle-immersive" title="Toggle Auto-Hide Toolbar (F11)">
        ▲ Immersive
      </button>
      <button class="action-btn btn-download-app" id="btn-open-download-modal">
        Get App (EXE / APK)
      </button>
    </div>
  </header>

  <!-- Tabs Strip -->
  <nav class="tabs-strip" id="tabs-strip">
    <div id="tabs-rail" style="display: flex; gap: 5px; align-items: center;"></div>
    <button class="btn-new-tab" id="btn-add-tab" title="New Tab (Ctrl+T)">+</button>
  </nav>

  <!-- Progress Bar Strip -->
  <div class="progress-bar-strip" id="progress-strip"></div>

  <!-- Viewport Canvas -->
  <main class="viewport-canvas" id="viewport-canvas"></main>

  <!-- Download Modal -->
  <div class="download-modal-overlay" id="download-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Staunt Browser Native Apps</h2>
        <span class="modal-close" id="modal-close-btn">✕</span>
      </div>
      <p style="font-size: 13px; color: var(--text-dim); line-height: 1.5;">
        Get maximum hardware acceleration, local gigabit Wi-Fi speed, and zero web iframe restrictions.
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/assets/Staunt-Browser-Setup.exe" download="Staunt-Browser-Setup.exe" class="action-btn" style="height: 38px; justify-content: center; background: #8b5cf6; color: #fff; font-size: 13px; text-decoration: none;">
          🪟 Download Windows .EXE (Hardware Accelerated)
        </a>
        <a href="/assets/Staunt-Browser-Mobile.apk" download="Staunt-Browser-Mobile.apk" class="action-btn" style="height: 38px; justify-content: center; background: #10b981; color: #fff; font-size: 13px; text-decoration: none;">
          📱 Download Android .APK (Universal 5.19 MB)
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const SEARCH_ENGINES = {
        google: { name: 'G', url: 'https://www.google.com/search?q=' },
        duckduckgo: { name: '🦆', url: 'https://html.duckduckgo.com/html/?q=' },
        bing: { name: 'b', url: 'https://www.bing.com/search?q=' }
      };
      let currentEngineKey = 'google';

      let tabs = [];
      let activeTabId = null;
      let nextTabId = 1;

      const omnibox = document.getElementById('omnibox-input');
      const engineBadge = document.getElementById('engine-badge');
      const tabsRail = document.getElementById('tabs-rail');
      const canvas = document.getElementById('viewport-canvas');
      const progressStrip = document.getElementById('progress-strip');
      const btnImmersive = document.getElementById('btn-toggle-immersive');
      const downloadModal = document.getElementById('download-modal');

      // ─── ENGINE SWITCHER ───
      const engineKeys = Object.keys(SEARCH_ENGINES);
      engineBadge.addEventListener('click', () => {
        const nextIdx = (engineKeys.indexOf(currentEngineKey) + 1) % engineKeys.length;
        currentEngineKey = engineKeys[nextIdx];
        engineBadge.textContent = SEARCH_ENGINES[currentEngineKey].name;
        omnibox.placeholder = 'Search ' + currentEngineKey.toUpperCase() + ' or enter any address';
      });

      // ─── PROGRESS BAR ───
      let progressTimer = null;
      function startProgress() {
        clearInterval(progressTimer);
        progressStrip.style.width = '20%';
        progressStrip.classList.add('loading');
        let p = 20;
        progressTimer = setInterval(() => {
          if (p < 85) {
            p += Math.random() * 15;
            progressStrip.style.width = Math.min(p, 85) + '%';
          }
        }, 120);
      }

      function finishProgress() {
        clearInterval(progressTimer);
        progressStrip.style.width = '100%';
        setTimeout(() => {
          progressStrip.classList.remove('loading');
          setTimeout(() => { progressStrip.style.width = '0%'; }, 200);
        }, 250);
      }

      // ─── UNIVERSAL URL RESOLVER (ANY WEB ADDRESS) ───
      function resolveTargetUrl(raw) {
        if (!raw) return '';
        let trimmed = raw.trim();

        // 1. If it's already a full protocol URL
        if (/^https?:\/\//i.test(trimmed)) {
          return optimizeUrl(trimmed);
        }

        // 2. If it's a domain name (e.g. youtube.com, google.com, en.wikipedia.org)
        if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(trimmed) && !trimmed.includes(' ')) {
          return optimizeUrl('https://' + trimmed);
        }

        // 3. Otherwise, it is a search query
        return SEARCH_ENGINES[currentEngineKey].url + encodeURIComponent(trimmed);
      }

      function optimizeUrl(url) {
        try {
          const u = new URL(url);
          // YouTube specific video playback optimization:
          // Google embed player is officially allowed in all iframes with zero bot-blocking and 1080p speed!
          if (u.hostname.includes('youtu.be')) {
            const vid = u.pathname.replace(/^\//, '').split('/')[0];
            if (vid) return 'https://www.youtube.com/embed/' + vid + '?autoplay=1&rel=0';
          } else if (u.hostname.includes('youtube.com')) {
            if (u.pathname === '/watch' && u.searchParams.get('v')) {
              return 'https://www.youtube.com/embed/' + u.searchParams.get('v') + '?autoplay=1&rel=0';
            } else if (u.pathname.startsWith('/shorts/')) {
              const vid = u.pathname.split('/shorts/')[1].split('/')[0];
              if (vid) return 'https://www.youtube.com/embed/' + vid + '?autoplay=1&rel=0';
            }
          }
        } catch(e) {}
        return url;
      }

      function getDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, '');
        } catch(e) {
          return url || 'New Tab';
        }
      }

      function getFaviconUrl(url) {
        if (!url) return '';
        try {
          const u = new URL(url);
          return 'https://www.google.com/s2/favicons?domain=' + u.hostname + '&sz=32';
        } catch(e) {
          return '';
        }
      }

      // ─── TABS MANAGEMENT ───
      function createTab(initialUrl = '') {
        const id = nextTabId++;
        const tab = {
          id: id,
          url: initialUrl,
          title: initialUrl ? getDomain(initialUrl) : 'New Tab',
          isNewTab: !initialUrl
        };
        tabs.push(tab);

        buildTabViewport(tab);
        renderTabs();
        switchTab(id);

        if (initialUrl) {
          navigateTo(initialUrl, id);
        }
      }

      function switchTab(id) {
        activeTabId = id;
        const tab = tabs.find(t => t.id === id);
        if (!tab) return;

        omnibox.value = tab.isNewTab ? '' : tab.url;

        document.querySelectorAll('.tab-viewport').forEach(vp => {
          vp.classList.toggle('active', String(vp.dataset.id) === String(id));
        });

        renderTabs();
      }

      function closeTab(id, e) {
        if (e) e.stopPropagation();
        const idx = tabs.findIndex(t => t.id === id);
        if (idx === -1) return;

        const vp = document.getElementById('viewport-' + id);
        if (vp) vp.remove();

        tabs.splice(idx, 1);

        if (tabs.length === 0) {
          createTab();
          return;
        }

        if (activeTabId === id) {
          const newIdx = Math.min(idx, tabs.length - 1);
          switchTab(tabs[newIdx].id);
        } else {
          renderTabs();
        }
      }

      function renderTabs() {
        tabsRail.innerHTML = '';
        tabs.forEach(tab => {
          const pill = document.createElement('div');
          pill.className = 'tab-pill' + (tab.id === activeTabId ? ' active' : '');
          pill.dataset.id = tab.id;
          
          let iconHtml = '';
          const fav = getFaviconUrl(tab.url);
          if (fav && !tab.isNewTab) {
            iconHtml = `<img class="tab-favicon" src="${fav}" alt="" onerror="this.style.display='none'" />`;
          } else {
            iconHtml = `<svg class="tab-favicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></svg>`;
          }

          pill.innerHTML = `
            ${iconHtml}
            <span class="tab-title-span">${escapeHtml(tab.title)}</span>
            <span class="tab-close-x" title="Close">✕</span>
          `;
          pill.addEventListener('click', () => switchTab(tab.id));
          pill.querySelector('.tab-close-x').addEventListener('click', (e) => closeTab(tab.id, e));
          tabsRail.appendChild(pill);
        });
      }

      function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ─── VIEWPORT DOM BUILDER ───
      function buildTabViewport(tab) {
        const vp = document.createElement('div');
        vp.className = 'tab-viewport';
        vp.id = 'viewport-' + tab.id;
        vp.dataset.id = tab.id;

        vp.innerHTML = `
          <!-- New Tab Luxury Launchpad -->
          <div class="newtab-wall" id="wall-${tab.id}">
            <div class="launch-clock" id="clock-${tab.id}">--:--</div>
            <div class="launch-greeting">Staunt Browser Ultra • Pure Sovereign Web Engine</div>

            <div class="speed-grid">
              <div class="speed-tile" data-url="https://www.google.com">
                <div class="tile-icon" style="background: rgba(66,133,244,0.18); color: #4285f4;">G</div>
                <div class="tile-label">Google</div>
              </div>
              <div class="speed-tile" data-url="https://www.youtube.com">
                <div class="tile-icon" style="background: rgba(255,0,0,0.18); color: #ff453a;">▶</div>
                <div class="tile-label">YouTube</div>
              </div>
              <div class="speed-tile" data-url="https://www.wikipedia.org">
                <div class="tile-icon" style="background: rgba(255,255,255,0.15); color: #cbd5e1;">W</div>
                <div class="tile-label">Wikipedia</div>
              </div>
              <div class="speed-tile" data-url="https://github.com">
                <div class="tile-icon" style="background: rgba(255,255,255,0.15); color: #fff;">⌥</div>
                <div class="tile-label">GitHub</div>
              </div>
              <div class="speed-tile" data-url="https://www.reddit.com">
                <div class="tile-icon" style="background: rgba(255,69,0,0.18); color: #ff4500;">R</div>
                <div class="tile-label">Reddit</div>
              </div>
              <div class="speed-tile" data-url="https://news.ycombinator.com">
                <div class="tile-icon" style="background: rgba(255,102,0,0.18); color: #ff6600;">Y</div>
                <div class="tile-label">Hacker News</div>
              </div>
              <div class="speed-tile" data-url="https://www.bbc.com/news">
                <div class="tile-icon" style="background: rgba(187,25,25,0.18); color: #ef4444;">B</div>
                <div class="tile-label">BBC News</div>
              </div>
              <div class="speed-tile" data-url="https://duckduckgo.com">
                <div class="tile-icon" style="background: rgba(222,88,51,0.18); color: #de5833;">🦆</div>
                <div class="tile-label">DuckDuckGo</div>
              </div>
            </div>

            <div class="app-badge-row">
              <a href="/assets/Staunt-Browser-Setup.exe" download="Staunt-Browser-Setup.exe" class="app-badge-card">
                <span>🪟</span>
                <div style="text-align: left;">
                  <div style="font-size: 12px; font-weight: 600;">Windows App</div>
                  <div style="font-size: 11px; color: var(--text-muted);">Hardware GPU Acceleration</div>
                </div>
                <div class="badge-btn">Get .EXE</div>
              </a>
              <a href="/assets/Staunt-Browser-Mobile.apk" download="Staunt-Browser-Mobile.apk" class="app-badge-card">
                <span>📱</span>
                <div style="text-align: left;">
                  <div style="font-size: 12px; font-weight: 600;">Android App</div>
                  <div style="font-size: 11px; color: var(--text-muted);">Universal 5.19 MB APK</div>
                </div>
                <div class="badge-btn" style="background: linear-gradient(135deg, #10b981, #059669);">Get .APK</div>
              </a>
            </div>
          </div>

          <!-- Pure Webpage Canvas -->
          <iframe 
            class="embed-frame" 
            id="frame-${tab.id}" 
            style="display: none;"
            allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen; microphone; camera; display-capture; geolocation"
          ></iframe>
        `;

        canvas.appendChild(vp);

        // Speed dials click listener
        vp.querySelectorAll('.speed-tile').forEach(tile => {
          tile.addEventListener('click', () => {
            const u = tile.dataset.url;
            if (u) navigateTo(u, tab.id);
          });
        });

        updateClock(tab.id);
      }

      function updateClock(tabId) {
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const clockEl = document.getElementById('clock-' + tabId);
        if (clockEl) clockEl.textContent = `${h}:${m} ${ampm}`;
      }

      setInterval(() => {
        tabs.forEach(t => updateClock(t.id));
      }, 1000);

      // ─── UNIVERSAL NAVIGATION ENGINE (LOADS ANY WEBSITE) ───
      function navigateTo(target, tabId = activeTabId) {
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;

        const resolved = resolveTargetUrl(target);
        if (!resolved) return;

        tab.url = resolved;
        tab.title = getDomain(resolved);
        tab.isNewTab = false;

        if (tabId === activeTabId) {
          omnibox.value = resolved;
        }
        renderTabs();

        const vp = document.getElementById('viewport-' + tab.id);
        if (vp) {
          const wall = vp.querySelector('.newtab-wall');
          const iframe = vp.querySelector('.embed-frame');

          if (wall) wall.style.display = 'none';
          if (iframe) {
            iframe.style.display = 'block';
            startProgress();

            let targetSrc = resolved;
            // Embeds (like YouTube player) load directly; all other websites route via our streaming proxy
            // which strips X-Frame-Options & CSP so ANY website displays cleanly!
            if (!resolved.includes('youtube.com/embed/')) {
              targetSrc = '/gateway?url=' + encodeURIComponent(resolved);
            }
            iframe.src = targetSrc;
            iframe.onload = () => finishProgress();
          }
        }
      }

      // ─── NAVIGATION CONTROLS ───
      document.getElementById('nav-back').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe && iframe.contentWindow) {
            try { iframe.contentWindow.history.back(); } catch(e) {}
          }
        }
      });

      document.getElementById('nav-forward').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe && iframe.contentWindow) {
            try { iframe.contentWindow.history.forward(); } catch(e) {}
          }
        }
      });

      document.getElementById('nav-reload').addEventListener('click', () => {
        const vp = document.getElementById('viewport-' + activeTabId);
        if (vp) {
          const iframe = vp.querySelector('.embed-frame');
          if (iframe) {
            startProgress();
            iframe.src = iframe.src;
          }
        }
      });

      document.getElementById('nav-home').addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab) return;
        tab.url = '';
        tab.title = 'New Tab';
        tab.isNewTab = true;
        omnibox.value = '';
        renderTabs();

        const vp = document.getElementById('viewport-' + tab.id);
        if (vp) {
          const wall = vp.querySelector('.newtab-wall');
          const iframe = vp.querySelector('.embed-frame');
          if (wall) wall.style.display = 'flex';
          if (iframe) {
            iframe.style.display = 'none';
            iframe.src = 'about:blank';
          }
        }
      });

      document.getElementById('nav-popout').addEventListener('click', () => {
        const tab = tabs.find(t => t.id === activeTabId);
        const targetUrl = (tab && tab.url) ? tab.url : (omnibox.value || 'https://www.google.com');
        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      });

      // ─── REAL-TIME POSTMESSAGE URL & NAVIGATION SYNC ───
      window.addEventListener('message', (event) => {
        if (!event.data) return;

        if (event.data.type === 'STAUNT_SHORTCUT') {
          handleGlobalShortcut(event.data);
          return;
        }

        if (event.data.type === 'STAUNT_URL_CHANGE') {
          const rawUrl = event.data.url;
          let cleanUrl = rawUrl;
          if (rawUrl.includes('/gateway?url=')) {
            cleanUrl = decodeURIComponent(rawUrl.split('/gateway?url=')[1]);
          }

          const tab = tabs.find(t => t.id === activeTabId);
          if (tab) {
            tab.url = cleanUrl;
            if (event.data.title) {
              tab.title = event.data.title;
              document.title = event.data.title + ' • Staunt Browser';
            }
            if (document.activeElement !== omnibox) {
              omnibox.value = cleanUrl;
            }
            renderTabs();
          }
        } else if (event.data.type === 'STAUNT_NAVIGATE') {
          if (event.data.url) {
            navigateTo(event.data.url);
          }
        }
      });

      // ─── GLOBAL NATIVE DESKTOP KEYBOARD SHORTCUTS ───
      function handleGlobalShortcut(e) {
        const isMac = (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0;
        const cmdOrCtrl = isMac ? e.metaKey : e.ctrlKey;
        const key = (e.key || '').toLowerCase();

        // Ctrl+T: New Tab
        if (cmdOrCtrl && key === 't') {
          if (e.preventDefault) e.preventDefault();
          createTab();
          omnibox.focus();
          return;
        }

        // Ctrl+W: Close Tab
        if (cmdOrCtrl && key === 'w') {
          if (e.preventDefault) e.preventDefault();
          if (activeTabId) closeTab(activeTabId);
          return;
        }

        // Ctrl+R or F5: Reload Active Tab
        if ((cmdOrCtrl && key === 'r') || e.key === 'F5') {
          if (e.preventDefault) e.preventDefault();
          const vp = document.getElementById('viewport-' + activeTabId);
          if (vp) {
            const iframe = vp.querySelector('.embed-frame');
            if (iframe && iframe.style.display !== 'none') {
              startProgress();
              iframe.src = iframe.src;
            }
          }
          return;
        }

        // Ctrl+L or Alt+D: Focus Omnibox
        if ((cmdOrCtrl && key === 'l') || (e.altKey && key === 'd')) {
          if (e.preventDefault) e.preventDefault();
          omnibox.focus();
          omnibox.select();
          return;
        }

        // Alt+Left: Back
        if (e.altKey && e.key === 'ArrowLeft') {
          if (e.preventDefault) e.preventDefault();
          const vp = document.getElementById('viewport-' + activeTabId);
          if (vp) {
            const iframe = vp.querySelector('.embed-frame');
            if (iframe && iframe.contentWindow) {
              try { iframe.contentWindow.history.back(); } catch(err) {}
            }
          }
          return;
        }

        // Alt+Right: Forward
        if (e.altKey && e.key === 'ArrowRight') {
          if (e.preventDefault) e.preventDefault();
          const vp = document.getElementById('viewport-' + activeTabId);
          if (vp) {
            const iframe = vp.querySelector('.embed-frame');
            if (iframe && iframe.contentWindow) {
              try { iframe.contentWindow.history.forward(); } catch(err) {}
            }
          }
          return;
        }

        // F11: Fullscreen
        if (e.key === 'F11') {
          if (e.preventDefault) e.preventDefault();
          toggleFullscreen();
          return;
        }

        // Escape: Close Modal or Blur Omnibox
        if (e.key === 'Escape') {
          if (downloadModal.classList.contains('open')) {
            downloadModal.classList.remove('open');
          } else if (document.activeElement === omnibox) {
            omnibox.blur();
          }
          return;
        }
      }

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === omnibox && e.key === 'Enter') return;
        handleGlobalShortcut(e);
      });

      // ─── OMNIBOX SUBMIT ───
      omnibox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = omnibox.value.trim();
          if (val) navigateTo(val);
        }
      });

      document.getElementById('btn-add-tab').addEventListener('click', () => createTab());

      // ─── IMMERSIVE MODE TOGGLE ───
      let isImmersive = false;
      function toggleImmersive(val) {
        isImmersive = typeof val === 'boolean' ? val : !isImmersive;
        document.body.classList.toggle('immersive-mode', isImmersive);
        btnImmersive.textContent = isImmersive ? '▼ Show Bar' : '▲ Immersive';
      }

      btnImmersive.addEventListener('click', () => toggleImmersive());

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          toggleImmersive(true);
        } else {
          document.exitFullscreen().catch(() => {});
          toggleImmersive(false);
        }
      }

      // ─── DOWNLOAD MODAL ───
      const btnModal = document.getElementById('btn-open-download-modal');
      const modalClose = document.getElementById('modal-close-btn');

      btnModal.addEventListener('click', () => downloadModal.classList.add('open'));
      modalClose.addEventListener('click', () => downloadModal.classList.remove('open'));
      downloadModal.addEventListener('click', (e) => {
        if (e.target === downloadModal) downloadModal.classList.remove('open');
      });

      // Initialize initial tab
      createTab();
    })();
  </script>
</body>
