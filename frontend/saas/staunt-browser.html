<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Staunt Core — Safari-Class Native Web Engine</title>
  <meta name="description" content="Authentic Apple Safari-class browser shell with dynamic frosted glass, 44px topbar, mobile bottom-docked ergonomic bar, and zero telemetry." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --topbar-height: 44px;
      --bottombar-height: 56px;
      --bg-shell: #101012;
      --bg-frosted: rgba(28, 28, 30, 0.78);
      --border-hairline: #38383a;
      --bg-capsule: rgba(255, 255, 255, 0.08);
      --bg-capsule-focus: rgba(44, 44, 46, 0.96);
      --border-capsule: rgba(255, 255, 255, 0.08);
      --border-capsule-focus: rgba(255, 255, 255, 0.22);
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.50);
      --accent-blue: #0a84ff;
      --system-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-shell);
      font-family: var(--system-font);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ================= 1. DESKTOP 44px TOP BAR ================= */
    .desktop-top-bar {
      height: var(--topbar-height);
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--bg-frosted);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-bottom: 0.5px solid var(--border-hairline);
    }

    .top-left-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0.5px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .dot-close { background-color: #ff5f56; }
    .dot-min { background-color: #ffbd2e; }
    .dot-max { background-color: #27c93f; }

    .nav-glyphs {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      opacity: 0.75;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .nav-btn:hover {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .omnibox-capsule-wrap {
      flex: 1;
      max-width: 640px;
      min-width: 240px;
      margin: 0 16px;
      display: flex;
      justify-content: center;
    }

    .omnibox-capsule {
      width: 100%;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-capsule);
      border: 0.5px solid var(--border-capsule);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      position: relative;
      cursor: text;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .omnibox-capsule.focused {
      background: var(--bg-capsule-focus);
      border-color: var(--border-capsule-focus);
      box-shadow: 0 0 0 2.5px rgba(10, 132, 255, 0.35);
      justify-content: flex-start;
    }

    .omnibox-lock-icon {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      margin-right: 6px;
      opacity: 0.7;
    }

    .omnibox-display-text {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 90%;
    }

    .omnibox-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--system-font);
      font-size: 12px;
      color: #ffffff;
      padding: 0;
    }

    .top-right-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-counter-pill {
      min-width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      cursor: pointer;
    }

    .download-app-btn {
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(10, 132, 255, 0.15);
      border: 0.5px solid rgba(10, 132, 255, 0.4);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .download-app-btn:hover {
      background: rgba(10, 132, 255, 0.25);
    }

    /* ================= 2. VIEWPORT HOST ================= */
    .webview-stage-host {
      position: absolute;
      top: var(--topbar-height);
      left: 0;
      width: 100%;
      height: calc(100vh - var(--topbar-height));
      background-color: var(--bg-shell);
      overflow: hidden;
    }

    .webview-stage-host iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ================= 3. MOBILE BOTTOM-DOCKED BAR ================= */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(var(--bottombar-height) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg-frosted);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border-top: 0.5px solid var(--border-hairline);
      z-index: 9999;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .mobile-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: var(--bottombar-height);
      padding: 0 12px;
      gap: 8px;
    }

    .mobile-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
    }

    .mobile-omnibox-capsule {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-capsule);
      border: 0.5px solid var(--border-capsule);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      cursor: text;
    }

    .mobile-omnibox-capsule.focused {
      background: var(--bg-capsule-focus);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.35);
    }

    .mobile-lock {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .mobile-omnibox-text {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mobile-omnibox-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
      color: #fff;
    }

    /* ================= 4. RESPONSIVE BREAKPOINTS ================= */
    @media (max-width: 768px) {
      .desktop-top-bar { display: none; }
      .webview-stage-host {
        top: 0;
        height: calc(100vh - var(--bottombar-height) - env(safe-area-inset-bottom, 0px));
      }
      .mobile-bottom-bar { display: block; }
    }

    /* ================= 5. START PAGE OVERLAY (FAVORITES) ================= */
    .startpage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-shell);
      background-image: radial-gradient(ellipse at 50% 25%, #1b1b22 0%, #0d0d0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      z-index: 10;
    }

    .greeting-time {
      font-size: 54px;
      font-weight: 200;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.90);
      line-height: 1;
      margin-bottom: 8px;
    }

    .greeting-text {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: -0.01em;
      margin-bottom: 40px;
    }

    .favorites-section {
      width: 100%;
      max-width: 640px;
    }

    .favorites-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 18px;
      padding-left: 10px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 20px 14px;
      justify-items: center;
    }

    @media (max-width: 640px) {
      .favorites-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px 12px;
      }
      .greeting-time { font-size: 44px; }
    }

    .favorite-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      width: 76px;
    }

    .squircle {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }

    .favorite-tile:hover .squircle {
      transform: scale(1.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .favorite-tile:active .squircle {
      transform: scale(0.96);
    }

    .tile-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-primary);
      opacity: 0.85;
      margin-top: 8px;
      text-align: center;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- DESKTOP TOP BAR -->
  <header class="desktop-top-bar" id="desktopTopBar">
    <div class="top-left-cluster">

  <!-- WEBVIEW VIEWPORT HOST -->
  <main class="webview-stage-host" id="stageHost">

  <!-- MOBILE BOTTOM BAR -->

      <button class="mobile-nav-btn" id="btnMobBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>

        <span class="mobile-omnibox-text" id="mobileDisplay">Search</span>

    </div>
  </nav>

  <script>
    // Universal Runtime Controller
    let currentUrl = '';
    const startPage = document.getElementById('startPage');
    const webFrame = document.getElementById('webFrame');

    const desktopCapsule = document.getElementById('desktopCapsule');
    const desktopDisplay = document.getElementById('desktopDisplay');
    const desktopInput = document.getElementById('desktopInput');

    const mobileCapsule = document.getElementById('mobileCapsule');
    const mobileDisplay = document.getElementById('mobileDisplay');
    const mobileInput = document.getElementById('mobileInput');

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hours % 12 || 12}:${mins}`;

      let greet = 'Good Evening';
      if (hours < 12) greet = 'Good Morning';
      else if (hours < 18) greet = 'Good Afternoon';
      
      const opt = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('clockGreeting').textContent = `${greet} • ${now.toLocaleDateString(undefined, opt)}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    function navigateTo(url) {
      if (!url || url === 'staunt://newtab') {
        currentUrl = '';
        webFrame.src = 'about:blank';
        webFrame.classList.add('hidden');
        startPage.classList.remove('hidden');
        desktopDisplay.textContent = 'Search or enter website name';
        mobileDisplay.textContent = 'Search';
        return;
      }

      let target = url.trim();
      if (!/^https?:\/\//i.test(target)) {
        if (/^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}/i.test(target)) {
          target = 'https://' + target;
        } else {
          // Zero-trace DuckDuckGo Lite search
          target = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(target);
        }
      }

      currentUrl = target;
      startPage.classList.add('hidden');
      webFrame.classList.remove('hidden');
      webFrame.src = target;

      try {
        const u = new URL(target);
        const host = u.hostname.replace(/^www\./, '');
        desktopDisplay.textContent = host;
        mobileDisplay.textContent = host;
      } catch(e) {
        desktopDisplay.textContent = target;
        mobileDisplay.textContent = target;
      }
    }

    // Omnibox Event Listeners (Desktop)
    desktopCapsule.addEventListener('click', () => {
      desktopCapsule.classList.add('focused');
      desktopDisplay.classList.add('hidden');
      desktopInput.classList.remove('hidden');
      desktopInput.value = currentUrl;
      desktopInput.focus();
      desktopInput.select();
    });

    desktopInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigateTo(desktopInput.value);
        desktopCapsule.classList.remove('focused');
        desktopInput.classList.add('hidden');
        desktopDisplay.classList.remove('hidden');
      } else if (e.key === 'Escape') {
        desktopCapsule.classList.remove('focused');
        desktopInput.classList.add('hidden');
        desktopDisplay.classList.remove('hidden');
      }
    });

    desktopInput.addEventListener('blur', () => {
      setTimeout(() => {
        desktopCapsule.classList.remove('focused');
        desktopInput.classList.add('hidden');
        desktopDisplay.classList.remove('hidden');
      }, 150);
    });

    // Omnibox Event Listeners (Mobile)
    mobileCapsule.addEventListener('click', () => {
      mobileCapsule.classList.add('focused');
      mobileDisplay.classList.add('hidden');
      mobileInput.classList.remove('hidden');
      mobileInput.value = currentUrl;
      mobileInput.focus();
      mobileInput.select();
    });

    mobileInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigateTo(mobileInput.value);
        mobileCapsule.classList.remove('focused');
        mobileInput.classList.add('hidden');
        mobileDisplay.classList.remove('hidden');
      } else if (e.key === 'Escape') {
        mobileCapsule.classList.remove('focused');
        mobileInput.classList.add('hidden');
        mobileDisplay.classList.remove('hidden');
      }
    });

    mobileInput.addEventListener('blur', () => {
      setTimeout(() => {
        mobileCapsule.classList.remove('focused');
        mobileInput.classList.add('hidden');
        mobileDisplay.classList.remove('hidden');
      }, 150);
    });

    // Nav buttons
    document.getElementById('btnBack').addEventListener('click', () => { try { webFrame.contentWindow.history.back(); } catch(e){} });
    document.getElementById('btnForward').addEventListener('click', () => { try { webFrame.contentWindow.history.forward(); } catch(e){} });
    document.getElementById('btnReload').addEventListener('click', () => { if (currentUrl) webFrame.src = currentUrl; });
    document.getElementById('btnNewTab').addEventListener('click', () => navigateTo('staunt://newtab'));

    document.getElementById('btnMobBack').addEventListener('click', () => { try { webFrame.contentWindow.history.back(); } catch(e){} });
    document.getElementById('btnMobForward').addEventListener('click', () => { try { webFrame.contentWindow.history.forward(); } catch(e){} });
    document.getElementById('btnMobNewTab').addEventListener('click', () => navigateTo('staunt://newtab'));

    // Visual Viewport Keyboard Adjustment for Mobile
    if (window.visualViewport) {
      const mobBar = document.getElementById('mobileBar');
      window.visualViewport.addEventListener('resize', () => {
        const diff = window.innerHeight - (window.visualViewport.height + window.visualViewport.offsetTop);
        if (diff > 0) {
          mobBar.style.transform = `translateY(-${diff}px)`;
        } else {
          mobBar.style.transform = 'translateY(0)';
        }
      });
    }

    // Edge Swipe Gestures
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      if (touchStartX < 35 && deltaX > 75) {
        // Edge swipe right -> Back
        try { webFrame.contentWindow.history.back(); } catch(e){}
      } else if (touchStartX > window.innerWidth - 35 && deltaX < -75) {
        // Edge swipe left -> Forward
        try { webFrame.contentWindow.history.forward(); } catch(e){}
      }
    }, { passive: true });
  </script>
</body>
</html>
