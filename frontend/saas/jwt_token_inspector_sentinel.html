<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
<header class="p-4 flex items-center justify-between border-b border-gray-700">
  <h1 class="text-2xl font-semibold">JWT Token Inspector & Signature Auditor</h1>
  <div class="flex items-center gap-2">
    <button id="darkToggle" class="p-2 rounded bg-gray-800 hover:bg-gray-700">
      <svg class="lucide lucide-moon" width="20" height="20" stroke="currentColor"></svg>
    </button>
  </div>
</header>

<main class="flex-1 p-4 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
  <!-- Input Panel -->
  <section class="card flex flex-col gap-4">
    <h3 class="text-lg font-semibold">JWT Input</h3>
    <textarea id="jwtInput" rows="6" placeholder="Paste your JWT here..." class="bg-gray-800 text-gray-200 rounded p-2 resize-none"></textarea>
    <div class="flex flex-col gap-2">
      <label class="flex items-center gap-2">
        <span>Algorithm:</span>
        <select id="algSelect" class="bg-gray-800 text-gray-200 rounded p-1">
          <option value="HS256">HS256 (HMAC SHA-256)</option>
          <option value="RS256">RS256 (RSA SHA-256)</option>
        </select>
      </label>
      <label class="flex items-center gap-2">
        <span>Secret Key (for HS256):</span>
        <input id="secretKey" type="text" placeholder="Enter secret" class="bg-gray-800 text-gray-200 rounded p-1 flex-1">
      </label>
    </div>
    <div class="flex gap-2">
      <button id="decodeBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 rounded p-2 text-white">Decode</button>
      <button id="verifyBtn" class="flex-1 bg-green-600 hover:bg-green-700 rounded p-2 text-white">Verify Signature</button>
    </div>
    <div id="errorMsg" class="text-red-400 hidden"></div>
  </section>

  <!-- Header Output -->
  <section class="card flex flex-col gap-2">
    <h3 class="text-lg font-semibold flex items-center gap-2">
      Header
      <button id="copyHeader" class="copy-btn text-gray-400 hover:text-white">
        <svg class="lucide lucide-copy" width="18" height="18" stroke="currentColor"></svg>
        Copy
      </button>
    </h3>
    <pre id="headerOutput" class="bg-gray-800 rounded p-2 overflow-auto flex-1 text-sm"></pre>
  </section>

  <!-- Payload Output -->
  <section class="card flex flex-col gap-2">
    <h3 class="text-lg font-semibold flex items-center gap-2">
      Payload
      <button id="copyPayload" class="copy-btn text-gray-400 hover:text-white">
        <svg class="lucide lucide-copy" width="18" height="18" stroke="currentColor"></svg>
        Copy
      </button>
    </h3>
    <pre id="payloadOutput" class="bg-gray-800 rounded p-2 overflow-auto flex-1 text-sm"></pre>
  </section>

  <!-- Signature & Expiration -->
  <section class="card flex flex-col gap-2">
    <h3 class="text-lg font-semibold flex items-center gap-2">
      Signature
      <button id="copySignature" class="copy-btn text-gray-400 hover:text-white">
        <svg class="lucide lucide-copy" width="18" height="18" stroke="currentColor"></svg>
        Copy
      </button>
    </h3>
    <pre id="signatureOutput" class="bg-gray-800 rounded p-2 overflow-auto flex-1 text-sm"></pre>
    <div id="expInfo" class="text-sm"></div>
    <div id="verifyResult" class="text-sm font-semibold"></div>
  </section>

  <!-- Export Panel -->
  <section class="card flex flex-col gap-2">
    <h3 class="text-lg font-semibold">Export</h3>
    <button id="exportBtn" class="bg-purple-600 hover:bg-purple-700 rounded p-2 text-white flex items-center gap-2">
      <svg class="lucide lucide-download" width="18" height="18" stroke="currentColor"></svg>
      Download JSON
    </button>
  </section>
</main>

<script>
/* Utility Functions */
const base64UrlDecode = str => {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  const pad = str.length % 4;
  if (pad) str += '='.repeat(4 - pad);
  return atob(str);
};

const base64UrlEncode = str => {
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};

const parseJSON = str => {
  try { return JSON.parse(str); } catch(e) { return null; }
};

const formatJSON = obj => JSON.stringify(obj, null, 2);

const displayError = msg => {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('hidden');
};

const clearError = () => {
  const el = document.getElementById('errorMsg');
  el.textContent = '';
  el.classList.add('hidden');
};

const copyToClipboard = async (text) => {
  try { await navigator.clipboard.writeText(text); alert('Copied to clipboard!'); } catch(e) { alert('Copy failed'); }
};

const downloadJSON = (data, filename='jwt_output.json') => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
};

/* Signature Verification (HS256) */
const verifyHS256 = async (jwt, secret) => {
  const [headerB64, payloadB64, signatureB64] = jwt.split('.');
  const data = `${headerB64}.${payloadB64}`;
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw',
    enc.encode(secret),
    {name: 'HMAC', hash: 'SHA-256'},
    false,
    ['sign', 'verify']
  );
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(data));
  const computed = base64UrlEncode(String.fromCharCode(...new Uint8Array(sig)));
  return computed === signatureB64;
};

/* Event Handlers */
document.getElementById('decodeBtn').addEventListener('click', () => {
  clearError();
  const jwt = document.getElementById('jwtInput').value.trim();
  if (!jwt) { displayError('JWT is required.'); return; }
  const parts = jwt.split('.');
  if (parts.length !== 3) { displayError('Invalid JWT format.'); return; }
  const header = parseJSON(base64UrlDecode(parts[0]));
  const payload = parseJSON(base64UrlDecode(parts[1]));
  if (!header || !payload) { displayError('Failed to parse JWT JSON.'); return; }
  document.getElementById('headerOutput').textContent = formatJSON(header);
  document.getElementById('payloadOutput').textContent = formatJSON(payload);
  document.getElementById('signatureOutput').textContent = parts[2];
  document.getElementById('verifyResult').textContent = '';
  // Expiration
  const exp = payload.exp;
  if (exp) {
    const now = Math.floor(Date.now() / 1000);
    const diff = exp - now;
    const status = diff > 0 ? `Expires in ${Math.floor(diff/60)} min(s)` : `Expired ${Math.floor(-diff/60)} min(s) ago`;
    document.getElementById('expInfo').textContent = status;
  } else {
    document.getElementById('expInfo').textContent = 'No exp claim.';
  }
});

document.getElementById('verifyBtn').addEventListener('click', async () => {
  clearError();
  const jwt = document.getElementById('jwtInput').value.trim();
  const alg = document.getElementById('algSelect').value;
  const secret = document.getElementById('secretKey').value;
  if (!jwt) { displayError('JWT is required.'); return; }
  if (alg === 'HS256') {
    if (!secret) { displayError('Secret key required for HS256.'); return; }
    const valid = await verifyHS256(jwt, secret);
    document.getElementById('verifyResult').textContent = valid ? 'Signature is VALID' : 'Signature is INVALID';
    document.getElementById('verifyResult').className = valid ? 'text-green-400' : 'text-red-400';
  } else {
    document.getElementById('verifyResult').textContent = 'Verification not supported for selected algorithm.';
    document.getElementById('verifyResult').className = 'text-yellow-400';
  }
});

document.getElementById('copyHeader').addEventListener('click', () => {
  const txt = document.getElementById('headerOutput').textContent;
  copyToClipboard(txt);
});

document.getElementById('copyPayload').addEventListener('click', () => {
  const txt = document.getElementById('payloadOutput').textContent;
  copyToClipboard(txt);
});

document.getElementById('copySignature').addEventListener('click', () => {
  const txt = document.getElementById('signatureOutput').textContent;
  copyToClipboard(txt);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const header = document.getElementById('headerOutput').textContent;
  const payload = document.getElementById('payloadOutput').textContent;
  const signature = document.getElementById('signatureOutput').textContent;
  const data = {header: parseJSON(header), payload: parseJSON(payload), signature};
  downloadJSON(data);
});

/* Dark Mode Toggle */
document.getElementById('darkToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  const icon = document.querySelector('#darkToggle svg');
  if (document.documentElement.classList.contains('dark')) {
    icon.setAttribute('data-name', 'sun');
  } else {
    icon.setAttribute('data-name', 'moon');
  }
  lucide.createIcons();
});

/* Initialize Lucide Icons */
lucide.createIcons();
</script>
